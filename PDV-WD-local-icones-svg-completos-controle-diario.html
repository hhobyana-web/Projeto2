<style>

*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:650}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #9db4ff;outline-offset:2px}.primary{background:linear-gradient(135deg,#1b74e0,#145bbb);color:#fff;box-shadow:0 4px 10px rgba(23,105,210,.18)}.primary:hover{background:linear-gradient(135deg,#145bbb,#0f50a8)}.secondary{background:#eaf2fc;color:#164b8d}.danger{background:#fdecec;color:var(--red)}.ghost{background:transparent;color:var(--muted)}.block{width:100%}
.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}

.nav{display:grid;gap:4px;padding-top:5px}.nav button{color:#d9e6f6;background:transparent;text-align:left;display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:9px;font-weight:550}.nav button.active,.nav button:hover{background:#1b477b;color:#fff}.nav button.active{box-shadow:inset 3px 0 0 #ff922e}.nav .ico{width:20px;text-align:center}

.chart{height:190px;display:flex;align-items:flex-end;gap:12px;padding:10px 4px 0;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 45px,#e9eef6 46px)}body.dark .chart{background:repeating-linear-gradient(to bottom,transparent 0,transparent 45px,#273956 46px)}.bar-group{height:100%;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px;min-width:0}.bar{width:min(27px,80%);border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#ffad4d,#f58220);min-height:4px}.bar-label{font-size:10px;color:var(--muted);padding-bottom:8px}

.cart-line{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}.cart-line b{font-size:13px}.cart-line small{display:block;color:var(--muted);margin-top:3px}.qty{display:flex;align-items:center;gap:7px}.qty button{padding:4px 10px;background:#edf1fa;color:#233b7a}.totals{display:grid;gap:9px;margin:15px 0}.total-row{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.total-row.final{font-size:18px;color:var(--text);font-weight:800;padding-top:11px;border-top:1px solid var(--line)}
.empty{padding:30px 15px;text-align:center;color:var(--muted);font-size:13px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:6px;font-size:12px;font-weight:700}.field input,.field select,.field textarea{width:100%;min-width:0}.field.full{grid-column:1/-1}.hint{font-size:11px;color:var(--muted);line-height:1.6;margin-top:16px}.notice{padding:12px 14px;border-radius:10px;background:#fff7e6;color:#875c13;font-size:12px;line-height:1.5;margin-bottom:16px}
.toast{position:fixed;right:22px;bottom:22px;background:#0e2a4e;color:#fff;padding:13px 17px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:100;max-width:min(420px,calc(100vw - 30px));font-size:13px;border-left:4px solid #ff922e;opacity:0;transform:translateY(12px);transition:all .25s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}.toast.err{border-left-color:#dc2626}
.modal-overlay{position:fixed;inset:0;background:rgba(8,20,38,.55);display:grid;place-items:center;z-index:60;padding:16px}.modal{background:var(--panel);color:var(--text);border-radius:16px;padding:22px;width:min(480px,100%);max-height:90vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.35);border-top:4px solid var(--accent)}.modal.wide{width:min(680px,100%)}.modal h3{margin:0 0 16px;font-size:18px}.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.hidden{display:none!important}
body:not(.authenticated) .app{display:none}
.login-screen{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 12% 12%,#d9eaff,transparent 42%),radial-gradient(circle at 88% 85%,#ffe8d1,transparent 36%),var(--bg)}body.authenticated .login-screen{display:none}.login-card{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:20px;padding:30px;box-shadow:0 22px 60px rgba(14,42,78,.14)}.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.login-card h2{margin:0 0 6px;font-size:23px}.login-card p{font-size:13px;line-height:1.6;color:var(--muted)}.login-card .field{margin:16px 0}.login-card input{width:100%;border:1px solid var(--line);border-radius:10px;padding:13px;background:var(--panel);color:var(--text)}.login-error{color:var(--red);font-size:12px;min-height:18px;margin:6px 0}
@media(max-width:1050px){.app{grid-template-columns:205px 1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-main{grid-template-columns:1fr}.content{padding:20px}.product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Melhorias de navegação móvel: acessibilidade, toque e transições suaves */
.sidebar{min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(183,201,226,.35) transparent;-webkit-overflow-scrolling:touch}
.sidebar::-webkit-scrollbar{width:5px}.sidebar::-webkit-scrollbar-thumb{background:rgba(183,201,226,.35);border-radius:8px}
.nav-group-toggle,.nav button{min-height:44px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.nav button{transition:background-color .18s ease,color .18s ease,transform .18s ease}
.nav button:active,.nav-group-toggle:active{transform:scale(.985)}
.nav .ico{display:inline-grid;place-items:center;flex:0 0 26px;width:26px;height:26px;color:#a9c9f2;transition:color .18s ease,transform .18s ease}
.nav .ico svg,.nav-group-toggle .group-ico,.nav-chevron svg{display:block;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ui-icon{display:inline-block;width:1.05em;height:1.05em;vertical-align:-.16em;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.ui-icon-lg{width:1.3em;height:1.3em;vertical-align:-.24em}
.nav button.active .ico,.nav button:hover .ico{color:#ffb45f;transform:translateY(-1px)}
.nav-group-toggle{gap:10px}.nav-group-toggle .group-ico{width:18px;height:18px;flex:0 0 18px;color:#a9c9f2}.nav-group-toggle .group-title{flex:1}.nav-chevron{display:inline-flex;align-items:center;justify-content:center;color:#a9c9f2}.nav-chevron svg{width:16px;height:16px;transition:transform .18s ease}.nav-group-toggle[aria-expanded="true"] .nav-chevron svg{transform:rotate(180deg)}
.nav-group-items{animation:navReveal .18s ease both;transform-origin:top}
@keyframes navReveal{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.mobile-menu{width:44px;height:44px;min-width:44px;padding:0;display:none;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:12px;font-size:22px;line-height:1;transition:background .18s ease,transform .18s ease}
.mobile-menu:active{transform:scale(.95)}
.sidebar-backdrop{position:fixed;inset:0;z-index:39;background:rgba(5,15,30,.58);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);opacity:0;visibility:hidden;transition:opacity .24s ease,visibility .24s ease;touch-action:manipulation}
.sidebar-backdrop.visible{opacity:1;visibility:visible}
@media(max-width:720px){
 .app{grid-template-columns:minmax(0,1fr);min-width:0}
 .sidebar{position:fixed;inset:0 auto 0 0;width:min( min(320px, 88vw), 340px);height:100dvh;height:100vh;height:100dvh;z-index:40;padding:calc( max(16px, env(safe-area-inset-top)) ) 12px calc(max(16px, env(safe-area-inset-bottom)));gap:18px;transform:translate3d(-105%,0,0);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:12px 0 42px rgba(0,0,0,.28);visibility:hidden;will-change:transform}
 .sidebar.open{transform:translate3d(0,0,0);visibility:visible}
 .brand{padding:4px 8px 10px}.brand h1{font-size:18px}.brand small{font-size:12px}
 .nav-label{font-size:10px}.nav-group{margin-bottom:8px}.nav-group-toggle{padding:13px 12px;font-size:12px;border-radius:11px}
 .nav{gap:5px;padding-top:7px}.nav button{padding:12px;border-radius:11px;font-size:14px;gap:12px}
 .sidebar-bottom{padding:12px 10px;font-size:12px;border-top:1px solid rgba(183,201,226,.16)}
 .mobile-menu{display:inline-flex;flex-shrink:0}
 .topbar{height:auto;min-height:64px;padding: max(8px, env(safe-area-inset-top)) 12px 8px;gap:8px}
 .top-left{gap:10px;min-width:0}.topbar h2{font-size:16px;max-width:38vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .top-actions{gap:6px}.top-actions #themeBtn{min-width:40px;min-height:40px;padding:8px}.avatar{width:32px;height:32px;flex-shrink:0}.logout-btn{padding:8px 10px;min-height:40px}
 .content{padding:14px 10px calc(18px + env(safe-area-inset-bottom));width:100%;overflow-x:hidden}
 .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.metric{padding:13px}.metric strong{font-size:21px}
 .panel{padding:14px;border-radius:13px}.page-head h3{font-size:21px}.page-head p{font-size:13px}
 .product-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.product{padding:10px;min-height:116px}
 .table-wrap{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
}
@media(max-width:380px){
 .sidebar{width:min(300px,90vw)}.topbar{padding-left:8px;padding-right:8px}.topbar h2{max-width:31vw;font-size:15px}.top-actions{gap:4px}.logout-btn{font-size:11px;padding:7px 8px}.content{padding-left:8px;padding-right:8px}.cards{gap:7px}.metric{padding:10px}.metric strong{font-size:19px}
}
@media(prefers-reduced-motion:reduce){.sidebar,.sidebar-backdrop,.nav button,.nav-group-items,.mobile-menu,.toast{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

</style>
</head>
<body>

<section class="login-screen" aria-label="Acesso">
  <form class="login-card" id="loginForm">
    <div class="login-brand"><div class="logo">WD</div><div><strong>PDV-WD</strong><div style="font-size:12px;color:var(--muted);margin-top:3px">Gestão Comercial Integrada</div></div></div>
    <h2>Iniciar sessão</h2>
    <p>Introduz o teu PIN de acesso para continuar.</p>
    <label class="field" for="loginCode">PIN de acesso<input id="loginCode" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••••" required autofocus></label>
    <div class="login-error" id="loginError" role="alert"></div>
    <button class="primary block" type="submit">Entrar</button>
  </form>
</section>

<div class="app">
<div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>
<aside class="sidebar" id="sidebar" aria-label="Menu principal" tabindex="-1">
  <div class="brand"><div class="logo">WD</div><div><h1>PDV-WD</h1><small>Gestão Comercial Integrada</small></div></div>
  <div id="navRoot"></div>
  <div class="sidebar-bottom" id="sidebarUser">PDV-WD<br>v2.0 · Moçambique · MZN</div>
</aside>
<main class="main">
<header class="topbar">
  <div class="top-left"><button class="mobile-menu" id="menuBtn" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar" title="Abrir menu"><span aria-hidden="true">☰</span></button><div><h2 id="topTitle">Visão geral</h2><div class="crumb">PDV-WD / <span id="crumb">Painel</span></div></div></div>
  <div class="top-actions"><input class="search" id="globalSearch" placeholder="Pesquisar produtos..." aria-label="Pesquisar produtos"><button class="secondary" id="themeBtn" title="Alternar tema">☾</button><div class="avatar" id="userAvatar" title="">?</div><button class="logout-btn" id="logoutBtn" type="button">Sair</button></div>
</header>
<div class="content" id="content"></div>
</main>
</div>

<div id="modalRoot"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
// ===================== helpers =====================
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('pt-MZ',{style:'currency',currency:'MZN',maximumFractionDigits:2}).format(+n||0);
const uid=p=>p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const dateISO=(date=new Date())=>{const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Maputo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(date).map(x=>[x.type,x.value]));return p.year+'-'+p.month+'-'+p.day;};
const todayISO=()=>dateISO(new Date());
const nowTime=()=>new Date().toLocaleTimeString('pt-PT',{timeZone:'Africa/Maputo',hour:'2-digit',minute:'2-digit'});
const fmtDT=iso=>new Date(iso).toLocaleString('pt-PT',{timeZone:'Africa/Maputo',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const DB={get(k,f){try{const v=JSON.parse(localStorage.getItem('sv_'+k));return v===null||v===undefined?f:v;}catch(e){return f;}},set(k,v){localStorage.setItem('sv_'+k,JSON.stringify(v));}};

// ===================== camada de dados: LOCAL (sem servidor) =====================
// PDV-WD v2.1 — manual operacional integrado: toda a informação fica neste dispositivo
// (localStorage). Os PINs existem apenas como hash SHA-256.
const ROLE_LABEL={administrador:'Administrador',gerente:'Gerente',gestor_stock:'Gestor de Stock',operador_caixa:'Operador de Caixa',vendedor:'Vendedor/Servente',controlador_bar:'Controlador de Bar'};
const SUPER_PIN_HASH='2dfe2460c61959fa3c960ad30888cc09a55be8d2432741dc8c00827b2bd16d8e';
const SEED_ADMIN_HASH='5817ae4948371f9b6b7d94615c0704e6a13ba5a773938351ebd832d0fcdbdf2f';
const PERMS_BY_ROLE={
 gerente:['day.open','day.close','cash.open','cash.close','sales.create','sales.view','sales.pay','sales.discount','sales.cancel','tables.open','bills.print','invoices.view','products.manage','stock.view','reports.view','audit.view','kds.view','bar.reconcile','bar.approve'],
 gestor_stock:['invoices.create','invoices.view','stock.receive','stock.transfer','stock.issue','stock.view','products.manage','reports.view','kds.view','bar.reconcile','bar.review'],

function sha256(ascii){ // SHA-256 em JS puro (sem crypto.subtle — funciona em qualquer contexto)
 function rr(v,a){return(v>>>a)|(v<<(32-a));}
 var maxWord=Math.pow(2,32),result='',words=[],asciiBitLength=ascii.length*8;
 var hash=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[];
 var primeCounter=k.length,isComposite={},candidate,i,j;
 for(candidate=2;primeCounter<64;candidate++){
  if(!isComposite[candidate]){
   for(i=0;i<313;i+=candidate)isComposite[i]=candidate;
   hash[primeCounter]=(Math.pow(candidate,.5)*maxWord)|0;
   k[primeCounter++]=(Math.pow(candidate,1/3)*maxWord)|0;
  }
 }
 ascii+='\x80';
 while(ascii.length%64-56)ascii+='\x00';
 for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);words[i>>2]|=j<<((3-i)%4)*8;}
 words[words.length]=((asciiBitLength/maxWord)|0);
 words[words.length]=(asciiBitLength);
 for(j=0;j<words.length;){
  var w=words.slice(j,j+=16);
  var oldHash=hash;hash=hash.slice(0,8);
  for(i=0;i<64;i++){
   var w15=w[i-15],w2=w[i-2];
   var a=hash[0],e=hash[4];
   var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]
    +(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
   var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
   hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0;
  }
  for(i=0;i<8;i++)hash[i]=(hash[i]+oldHash[i])|0;
 }
 for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;result+=((b<16)?0:'')+b.toString(16);}
 return result;
}

function perm(p){const u=currentUser;if(!u)return false;const r=u.app_metadata.role;return r==='administrador'||(u.app_metadata.perms||[]).includes(p);}
function audit(table,rowId,action){D.audit_log.push({id:++seq.audit,table_name:table,row_id:String(rowId),action,actor:currentUser?currentUser.id:null,actor_name:currentUser?currentUser.user_metadata.name:'sistema',at:new Date().toISOString()});}
function dayOpenD(){const t=todayISO();return D.operating_days.find(x=>x.date===t&&x.status==='aberto');}
function stockQty(pid,loc){const r=D.stock_levels.find(s=>s.product_id===pid&&s.location===loc);return r?r.qty:0;}
// Produtos de venda podem consumir uma fracção de um produto-base (ex.: cerveja à pressão).
function stockRequirement(item){const p=D.products.find(x=>String(x.id)===String(item.id));if(!p)return null;const qty=+item.qty||0;if(p.recipe_base_id&&+p.recipe_ml>0){return {product_id:+p.recipe_base_id,qty:qty*(+p.recipe_ml)/1000,unit:'L',ml:qty*(+p.recipe_ml),sale_product_id:p.id};}return {product_id:p.id,qty,unit:p.unit||'un',ml:null,sale_product_id:p.id};}
function requirementsForItems(items){const map=new Map();(items||[]).forEach(i=>{const r=stockRequirement(i);if(!r)throw fail('Produto de venda não encontrado: '+i.id);const old=map.get(String(r.product_id));if(old){old.qty+=r.qty;if(old.ml!==null)old.ml+=r.ml;}else map.set(String(r.product_id),r);});return [...map.values()];}
function canFulfilItems(items,loc='bar'){return requirementsForItems(items).every(r=>stockQty(r.product_id,loc)+1e-9>=r.qty);}
function snapshotItemConsumption(item){return {...item,stock_usage:requirementsForItems([item])};}
function stockAdd(pid,loc,delta){let r=D.stock_levels.find(s=>String(s.product_id)===String(pid)&&s.location===loc);if(!r){r={product_id:pid,location:loc,qty:0};D.stock_levels.push(r);}r.qty=(+r.qty||0)+(+delta||0);if(loc==='bar'){const p=D.products.find(x=>String(x.id)===String(pid));if(p)p.stock=r.qty;}}
function recalcBill(bid){const b=D.bills.find(x=>x.id===bid);if(b)b.total=D.bill_items.filter(i=>i.bill_id===bid).reduce((s,i)=>s+i.price*i.qty,0);}
const err=(m,code)=>({data:null,error:{message:m,code:code||'ERR'}});
const okk=data=>({data,error:null});
function fail(m,code){const e=new Error(m);e.code=code||'ERR';throw e;}
function cmp(col){return(a,b)=>{const x=a[col],y=b[col];const nx=+x,ny=+y;if(x!==''&&y!==''&&isFinite(nx)&&isFinite(ny))return nx-ny;return String(x).localeCompare(String(y));};}

function q(table){return new LocalQuery(table);}
class LocalQuery{
 constructor(table){this.table=table;this.op='select';this.payload=null;this.filters=[];this._order=null;this._limit=null;this._single=false;}
 select(){this.op='select';return this;}
 insert(rows){this.op='insert';this.payload=rows;return this;}
 upsert(rows){this.op='upsert';this.payload=rows;return this;}
 update(patch){this.op='update';this.payload=patch;return this;}
 delete(){this.op='delete';return this;}
 eq(k,v){this.filters.push([k,v]);return this;}
 order(col,opts){this._order={col,desc:opts&&opts.ascending===false};return this;}
 limit(n){this._limit=n;return this;}
 single(){this._single=true;return this;}
 then(res){let out;try{out=this.exec();}catch(e){if(e&&e.code==='42501'&&currentUser){D.audit_log.push({id:++seq.audit,table_name:this.table,row_id:'-',action:'DENIED:'+this.op,actor:currentUser.id,actor_name:currentUser.user_metadata.name,at:new Date().toISOString()});persistD();}out=err(e.message,e.code);}res(out);}
 match(r){return this.filters.every(([k,v])=>String(r[k])===String(v));}
 insertOne(r){r=JSON.parse(JSON.stringify(r));const f=RULES.insert[this.table];if(f)f(r);const auto={customers:'customers',bill_items:'bill_items',stock_movements:'movements',supplier_invoices:'invoices',invoice_items:'invitems',cash_movements:'movements',suppliers:'suppliers',time_entries:'time',credit_payments:'credit'};if(auto[this.table]&&!r.id)r.id=++seq[auto[this.table]];if(!r.created_at&&['products','customers','sales','cash_sessions','cash_movements','profiles','tables','bills','bill_items','stock_movements','supplier_invoices','invoice_items'].includes(this.table))r.created_at=new Date().toISOString();D[this.table].push(r);return r;}
 upsertOne(r){const rows=D[this.table];let ex=r.id!==undefined?rows.find(x=>String(x.id)===String(r.id)):(this.table==='settings'&&r.key!==undefined?rows.find(x=>String(x.key)===String(r.key)):null);if(ex){Object.assign(ex,JSON.parse(JSON.stringify(r)));return ex;}return this.insertOne(r);}
 exec(){
  if(this.op==='select'&&{stock_movements:'stock.view',v_stock_status:'stock.view',supplier_invoices:'invoices.view',invoice_items:'invoices.view',suppliers:'invoices.view'}[this.table]&&!perm({stock_movements:'stock.view',v_stock_status:'stock.view',supplier_invoices:'invoices.view',invoice_items:'invoices.view',suppliers:'invoices.view'}[this.table])){if(currentUser){D.audit_log.push({id:++seq.audit,table_name:this.table,row_id:'-',action:'DENIED:select',actor:currentUser.id,actor_name:currentUser.user_metadata.name,at:new Date().toISOString()});persistD();}return err('Sem permissão para consultar '+this.table+'.','42501');}
  if(this.table==='v_stock_status'){const out=D.products.map(p=>({id:p.id,name:p.name,sku:p.sku,unit:p.unit,cost_price:p.cost_price,min_stock:p.min_stock,sector:p.sector,armazem:stockQty(p.id,'armazem'),bar:stockQty(p.id,'bar'),cozinha:stockQty(p.id,'cozinha')}));return okk(this._order?out.slice().sort(cmp(this._order.col)):out);}
  if(this.table==='role_permissions'){let out=D.role_permissions.filter(r=>this.match(r));if(this._order)out=out.slice().sort(cmp(this._order.col));return okk(out);}
  if(this.table==='profiles'){
   let out=D.profiles.filter(r=>this.match(r)).map(r=>({id:r.id,name:r.name,role:r.role,active:r.active,created_at:r.created_at}));
   if(this._order)out=out.slice().sort(cmp(this._order.col));
   return okk(this._single?(out[0]||null):out);
  }
  if(this.table==='stock_levels'&&this.op!=='select')return err('Operação não permitida nesta tabela.');
  if(this.table==='audit_log'&&this.op!=='select')return err('O histórico de auditoria não pode ser alterado.');
  const rows=D[this.table]||[];
  if(this.op==='select'){let out=rows.filter(r=>this.match(r));if(this._order){out=out.slice().sort(cmp(this._order.col));if(this._order.desc)out.reverse();}if(this._limit)out=out.slice(0,this._limit);return okk(this._single?(out[0]||null):out);}
  if(this.op==='insert'){const arr=Array.isArray(this.payload)?this.payload:[this.payload];if(!arr.length)return okk([]);const out=arr.map(r=>this.insertOne(r));if(this.table==='bill_items')D.bills.forEach(b=>recalcBill(b.id));persistD();return okk(this._single?out[0]:out);}
  if(this.op==='upsert'){const arr=Array.isArray(this.payload)?this.payload:[this.payload];const out=arr.map(r=>this.upsertOne(r));if(this.table==='bill_items')D.bills.forEach(b=>recalcBill(b.id));persistD();return okk(out);}
  if(this.op==='update'){const out=[];rows.forEach(r=>{if(this.match(r)){const old=JSON.parse(JSON.stringify(r));const candidate=JSON.parse(JSON.stringify(r));Object.assign(candidate,JSON.parse(JSON.stringify(this.payload)));const f=RULES.update[this.table];if(f)f(old,candidate);Object.assign(r,candidate);out.push(r);}});if(this.table==='bill_items')D.bills.forEach(b=>recalcBill(b.id));if(out.length)persistD();return okk(out);}
  if(this.op==='delete'){const f=RULES.delete[this.table];if(f)f(rows.filter(r=>this.match(r)));D[this.table]=rows.filter(r=>!this.match(r));if(this.table==='bill_items')D.bills.forEach(b=>recalcBill(b.id));persistD();return okk(null);}
  return err('Operação desconhecida.');
 }
}

const RULES={
 insert:{
  sales(r){
   if(!perm('sales.create'))throw fail('Sem permissão para registar vendas.','42501');
   if(!dayOpenD())throw fail('O dia operacional não está aberto. O caixa deve abrir o dia antes de iniciar as vendas.');
   if(!D.cash_sessions.some(s=>!s.closed_at))throw fail('Não é possível vender: nenhum turno de caixa está aberto. O caixa deve abrir o turno antes da primeira venda.');
   if((+r.discount||0)>0&&!perm('sales.discount'))throw fail('Sem permissão para aplicar descontos.','42501');
   if(!canFulfilItems(r.items||[],'bar'))throw fail('Stock insuficiente no bar para uma ou mais apresentações.');
   r.items=(r.items||[]).map(snapshotItemConsumption);
   requirementsForItems(r.items).forEach(u=>{const p=D.products.find(x=>String(x.id)===String(u.product_id));if(p&&u.product_id===p.id)p.stock=Math.max(0,(+p.stock||0)-u.qty);stockAdd(u.product_id,'bar',-u.qty);});
   audit('sales',r.id,'INSERT');
  },
  bills(r){
   r.status=r.status||'aberta';r.total=+r.total||0;
   if(!perm('tables.open'))throw fail('Sem permissão para abrir mesas.','42501');
   if(D.bills.find(b=>b.table_id===r.table_id&&!['paga','encerrada'].includes(b.status)))throw fail('Já existe uma conta aberta nesta mesa.','23505');
   audit('bills',r.id,'INSERT');
  },
  bill_items(r){if(!perm('tables.open'))throw fail('Sem permissão.','42501');audit('bill_items',r.id,'INSERT');},
  stock_movements(r){
   const need={compra:'stock.receive',transferencia:'stock.transfer',saida:'stock.issue',perda:'stock.issue'}[r.kind]||'stock.issue';
   if(!perm(need))throw fail('Sem permissão para este tipo de movimento ('+need+').','42501');
   if(!(r.qty>0))throw fail('A quantidade tem de ser positiva.');
   if(r.kind==='compra'){if(r.origin!=='fornecedor'||r.destination!=='armazem')throw fail('Uma compra entra sempre no armazém a partir do fornecedor.');stockAdd(r.product_id,'armazem',r.qty);}
   else if(r.kind==='transferencia'){
    if(r.origin===r.destination)throw fail('A origem e o destino têm de ser diferentes.');
    if(!['armazem','bar','cozinha'].includes(r.origin)||!['armazem','bar','cozinha'].includes(r.destination))throw fail('Transferências internas apenas entre armazém, bar e cozinha.');
    if(!r.admin_override&&stockQty(r.product_id,r.origin)<r.qty)throw fail('Stock insuficiente em '+r.origin+' para transferir '+r.qty+' unidades.');
    stockAdd(r.product_id,r.origin,-r.qty);stockAdd(r.product_id,r.destination,r.qty);
   }else{
    if(r.destination!=='exterior')throw fail('Saídas e perdas devem ter destino "exterior".');
    if(!r.admin_override&&stockQty(r.product_id,r.origin)<r.qty)throw fail('Stock insuficiente em '+r.origin+' para registar a saída.');
    stockAdd(r.product_id,r.origin,-r.qty);
   }
   audit('stock_movements',r.id||'novo','INSERT');
  },
  supplier_invoices(r){
   r.status=r.status||'registada';
   if(!perm('invoices.create'))throw fail('Sem permissão para lançar facturas.','42501');
   if(D.supplier_invoices.find(x=>String(x.supplier_name).toLowerCase()===String(r.supplier_name).toLowerCase()&&x.invoice_number===r.invoice_number&&x.status!=='anulada'))throw fail('Factura duplicada: este fornecedor já tem uma factura com este número.','23505');
   audit('supplier_invoices',r.id||'novo','INSERT');
  },
  invoice_items(r){if(!perm('invoices.create'))throw fail('Sem permissão.','42501');},
  operating_days(r){
   r.status=r.status||'aberto';
   if(!perm('day.open'))throw fail('Sem permissão para abrir o dia.','42501');
   if(!r.date||r.date!==todayISO())throw fail('Só é permitido abrir o dia operacional da data actual.');
   if(D.operating_days.some(x=>x.status==='aberto'))throw fail('Já existe um dia operacional aberto. O caixa deve efectuar o fecho antes de abrir outro dia.');
   if(D.operating_days.some(x=>x.date===r.date))throw fail('O dia de hoje já foi aberto e fechado. Não é permitido reabri-lo.');
   if(D.operating_days.some(x=>x.date<r.date&&x.status!=='fechado'))throw fail('Existe um dia anterior por fechar. Regulariza o fecho antes de iniciar um novo dia.');
   audit('operating_days',r.date,'INSERT');
  },
  cash_sessions(r){
   if(!perm('cash.open'))throw fail('Sem permissão para abrir o caixa.','42501');
   if(!dayOpenD())throw fail('O dia operacional não está aberto.');
   if(D.cash_sessions.find(s=>!s.closed_at))throw fail('Já existe um turno de caixa aberto. Fecha-o antes de abrir outro.');
   audit('cash_sessions',r.id,'INSERT');
  },
  cash_movements(r){if(!perm('cash.open')&&!perm('sales.pay'))throw fail('Sem permissão.','42501');},
  products(r){if(!perm('products.manage'))throw fail('Sem permissão para gerir produtos.','42501');audit('products',r.id||'novo','INSERT');},
  customers(r){audit('customers',r.id||'novo','INSERT');},
  suppliers(r){if(!perm('invoices.create'))throw fail('Sem permissão.','42501');audit('suppliers',r.id||'novo','INSERT');},
  time_entries(r){audit('time_entries',r.id||'novo',r.type==='in'?'CLOCK_IN':'CLOCK_OUT');},
  credit_payments(r){if(!perm('sales.pay'))throw fail('Sem permissão para receber pagamentos.','42501');audit('credit_payments',r.id||'novo','CREDIT_PAY');},
  settings(r){if(!perm('settings.manage'))throw fail('Sem permissão para alterar configurações.','42501');}
 },
 update:{
  sales(old,n){
   if(!perm('sales.cancel'))throw fail('Apenas a gerência pode cancelar vendas.','42501');
   if(old.status==='cancelada'&&n.status!=='cancelada')throw fail('Uma venda cancelada não pode ser reativada.');
   if(['subtotal','total','tax','discount','method'].some(k=>String(n[k])!==String(old[k]))||JSON.stringify(n.items)!==JSON.stringify(old.items))throw fail('Os valores de uma venda são imutáveis.');
   if(n.status==='cancelada'&&old.status!=='cancelada'){for(const i of (n.items||[])){const uses=i.stock_usage||requirementsForItems([i]);uses.forEach(u=>{const p=D.products.find(x=>String(x.id)===String(u.product_id));if(p&&String(u.product_id)===String(p.id))p.stock=(+p.stock||0)+(+u.qty||0);stockAdd(u.product_id,'bar',+u.qty||0);});}D.cash_movements=D.cash_movements.filter(m=>m.ref!==n.id);if(n.bill_id){const bb=D.bills.find(x=>x.id===n.bill_id);if(bb&&['paga','parcialmente_paga'].includes(bb.status)){bb.paid_amount=Math.max(0,Math.round(((+bb.paid_amount||0)-(+n.total||0))*100)/100);bb.stock_deducted=false;bb.stock_usage=null;if(!bb.paid_amount){bb.status='conta_impressa';bb.payments=[];}else{bb.status='parcialmente_paga';}bb.sale_id=null;const tt=D.tables.find(x=>x.id===bb.table_id);if(tt)tt.status='ocupada';}}audit('sales',n.id,'CANCEL');}
  },
  bills(old,n){
   if(!perm('tables.open')&&!perm('sales.pay'))throw fail('Sem permissão.','42501');
   if(['paga','encerrada'].includes(old.status))throw fail('A conta já está paga/encerrada e não pode ser alterada.');
   if(n.status==='paga')throw fail('O pagamento deve ser registado através do fluxo de pagamento (botão "Registar pagamento").');
   if(n.status==='parcialmente_paga'&&!['conta_solicitada','conta_impressa','parcialmente_paga'].includes(old.status))throw fail('A conta não está pronta para pagamento parcial.');
   if(old.status!==n.status)audit('bills',n.id,'UPDATE:'+n.status);
   if(n.status==='conta_impressa'&&n.printed_at&&String(n.printed_at)!==String(old.printed_at||''))audit('bills',n.id,old.printed_at?'REPRINT':'PRINT');
  },
  tables(old,n){if(!perm('tables.open'))throw fail('Sem permissão.','42501');},
  bill_items(old,n){if(!perm('tables.open')&&!perm('kds.view'))throw fail('Sem permissão.','42501');},
  operating_days(old,n){
   if(!perm('day.close'))throw fail('Sem permissão para fechar o dia.','42501');
   if(old.status==='fechado')throw fail('O dia já está fechado e não pode ser alterado.');

    if(D.cash_sessions.find(s=>!s.closed_at))throw fail('Não é possível fechar o dia: todos os caixas devem efectuar o fecho dos seus turnos primeiro.');
    if(!D.cash_sessions.some(s=>(s.opened_at||'').slice(0,10)===n.date&&!!s.closed_at))throw fail('Não é possível fechar o dia: é obrigatório existir pelo menos um turno de caixa aberto e fechado nesta data.');
    if(D.bills.find(b=>!['paga','encerrada'].includes(b.status)))throw fail('Não é possível fechar o dia: existem contas de mesa por resolver.');
    audit('operating_days',n.date,'CLOSE');
   }
  },
  cash_sessions(old,n){
   if(!perm('cash.close'))throw fail('Sem permissão para fechar o caixa.','42501');
   if(old.closed_at)throw fail('Este turno de caixa já está fechado.');
   audit('cash_sessions',n.id,'CLOSE');
  },
  supplier_invoices(old,n){
   if(!perm('invoices.create'))throw fail('Sem permissão.','42501');
   if(n.status==='anulada'&&old.status!=='anulada'){
    for(const ii of D.invoice_items.filter(x=>x.invoice_id===old.id)){
     D.stock_movements.push({id:++seq.movements,kind:'ajuste',product_id:ii.product_id,qty:ii.qty,unit:ii.unit,origin:'armazem',destination:'exterior',doc_ref:old.invoice_number,note:'Anulação da factura '+(n.void_reason||''),user_id:currentUser.id,user_name:currentUser.user_metadata.name,created_at:new Date().toISOString()});
     stockAdd(ii.product_id,'armazem',-ii.qty);
    }
    audit('supplier_invoices',n.id,'VOID');
   }
  },
  products(old,n){if(!perm('products.manage'))throw fail('Sem permissão.','42501');audit('products',n.id,'UPDATE');},
  customers(old,n){audit('customers',n.id,'UPDATE');},
  settings(old,n){if(!perm('settings.manage'))throw fail('Sem permissão.','42501');}

function rpc(name,params){
 params=params||{};
 if(name==='pay_bill'){
  if(!perm('sales.pay'))return err('Sem permissão para registar pagamentos (sales.pay).','42501');
  if(!dayOpenD())return err('O dia operacional não está aberto.');
  const b=D.bills.find(x=>x.id===params.p_bill_id);
  if(!b)return err('Conta não encontrada.');
  if(!['conta_solicitada','conta_impressa','parcialmente_paga'].includes(b.status))return err('A conta não está pronta para pagamento (estado: '+b.status+').');
  const rate=+(D.settings.find(s=>s.key==='taxRate')||{value:16}).value||16;
  const sub=Math.round((D.bill_items.filter(i=>i.bill_id===b.id).reduce((s,i)=>s+i.price*i.qty,0))*100)/100,tax=Math.round(sub*rate)/100,grand=Math.round((sub+tax)*100)/100;
  let pays=Array.isArray(params.p_payments)&&params.p_payments.length?params.p_payments:[{method:params.p_method||'Numerário',amount:grand}];
  pays=pays.filter(x=>x.amount>0);
  if(!pays.length)return err('Indica o valor e o método de pagamento.');
  const paysSum=Math.round(pays.reduce((a,x)=>a+ +x.amount,0)*100)/100;
  if(paysSum>grand)return err('O valor pago ('+paysSum+') excede o total da conta ('+grand+').');
  const already=+(b.paid_amount||0);
  if(already+paysSum>grand+0.001)return err('Esta conta já tem '+already+' pago; restam '+(grand-already)+'.');
  const saleId='V'+todayISO().replace(/-/g,'')+'-'+String(++seq.audit).padStart(4,'0');
  const now=new Date();
  // O stock da conta é baixado uma única vez, no primeiro pagamento, mesmo que haja pagamentos parciais.
  if(!b.stock_deducted){
   const billLines=D.bill_items.filter(i=>i.bill_id===b.id).map(i=>({id:i.product_id,name:i.name,price:i.price,qty:i.qty}));
   if(!canFulfilItems(billLines,'bar'))return err('Stock insuficiente no bar para uma ou mais apresentações.');
   requirementsForItems(billLines).forEach(u=>{const p=D.products.find(x=>String(x.id)===String(u.product_id));if(p)p.stock=Math.max(0,(+p.stock||0)-u.qty);stockAdd(u.product_id,'bar',-u.qty);});
   b.stock_usage=requirementsForItems(billLines);b.stock_deducted=true;
  }
  const itemsForSale=b.sale_items_recorded?[]:D.bill_items.filter(i=>i.bill_id===b.id).map(i=>snapshotItemConsumption({id:i.product_id,name:i.name,price:i.price,qty:i.qty}));
  const taxPaid=Math.round((paysSum*rate/(100+rate))*100)/100;
  const row={id:saleId,date:todayISO(),time:now.toLocaleTimeString('pt-PT',{timeZone:'Africa/Maputo',hour:'2-digit',minute:'2-digit'}),items:itemsForSale,subtotal:Math.round((paysSum-taxPaid)*100)/100,discount:0,tax:taxPaid,total:paysSum,method:pays.map(x=>x.method).join(' + '),customer_id:null,customer_name:(D.tables.find(t=>t.id===b.table_id)||{}).label||'',user_id:currentUser.id,user_name:currentUser.user_metadata.name,status:'concluida',bill_id:b.id,created_at:now.toISOString()};
  D.sales.push(row);if(itemsForSale.length)b.sale_items_recorded=true;audit('sales',row.id,'INSERT');
  b.payments=(b.payments||[]).concat(pays.map(x=>({method:x.method,amount:+x.amount,time:row.time})));
  b.paid_amount=Math.round((already+paysSum)*100)/100;
  const cs=D.cash_sessions.find(s=>!s.closed_at&&s.opened_by===currentUser.id);
  if(cs)pays.filter(x=>x.method==='Numerário').forEach(x=>D.cash_movements.push({id:++seq.movements,session_id:cs.id,kind:'sale',amount:+x.amount,ref:saleId,note:'Pagamento da conta '+b.id,time:row.time,created_at:new Date().toISOString()}));
  if(b.paid_amount>=grand-0.001){b.status='paga';b.paid_at=new Date().toISOString();b.sale_id=saleId;const t=D.tables.find(x=>x.id===b.table_id);if(t)t.status='livre';}
  else b.status='parcialmente_paga';
  audit('bills',b.id,b.status==='paga'?'PAY':'PARTIAL_PAY');
  persistD();
  return okk(saleId);
 }
 if(name==='move_bill'){
  if(!perm('tables.open'))return err('Sem permissão.','42501');
  const b=D.bills.find(x=>x.id===params.p_bill_id);
  if(!b||['paga','encerrada'].includes(b.status))return err('Conta indisponível.');
  const target=D.tables.find(x=>x.id===params.p_target_table);
  if(!target)return err('Mesa de destino não encontrada.');
  if(target.id===b.table_id)return err('A mesa de destino é a mesma.');
  const other=D.bills.find(x=>x.table_id===target.id&&!['paga','encerrada'].includes(x.status));
  if(other){ // unir contas: mover artigos
   D.bill_items.forEach(i=>{if(i.bill_id===b.id)i.bill_id=other.id;});
   b.status='encerrada';
   recalcBill(other.id);recalcBill(b.id);
   audit('bills',b.id,'MERGE_INTO:'+other.id);
  }else{
   b.table_id=target.id;
   audit('bills',b.id,'MOVE_TO:'+target.id);
  }
  const oldT=D.tables.find(x=>x.id===b.table_id);
  D.tables.forEach(t=>{if(t.id===target.id)t.status='ocupada';else if(t.id!==b.table_id&&t.id!==target.id){/* nada */}});
  // libertar a mesa antiga (se não for a de destino)
  const srcId=params.p_source_table||0;
  D.tables.forEach(t=>{if(t.id===srcId)t.status='livre';});
  target.status='ocupada';
  persistD();
  return okk(true);
 }
 if(name==='apply_count'){
  if(!perm('stock.issue'))return err('Sem permissão (stock.issue).','42501');
  const counts=params.p_counts||{};
  let done=0;
  for(const key of Object.keys(counts)){
   const [pidS,loc]=key.split('|');const pid=+pidS;const counted=parseInt(counts[key],10);
   if(!Number.isInteger(counted))continue;
   const cur=stockQty(pid,loc);
   if(counted===cur)continue;
   const diff=counted-cur;
   D.stock_movements.push({id:++seq.movements,kind:'ajuste',product_id:pid,qty:Math.abs(diff),unit:(D.products.find(p=>p.id===pid)||{}).unit||'un',origin:loc,destination:diff>0?loc:'exterior',doc_ref:'',note:'Contagem física: '+(diff>0?'+':'')+diff,admin_override:true,user_id:currentUser.id,user_name:currentUser.user_metadata.name,created_at:new Date().toISOString()});
   stockAdd(pid,loc,diff);
   done++;
  }
  if(done)persistD();
  return okk(done);
 }
 if(name==='pay_credit'){
  if(!perm('sales.pay'))return err('Sem permissão.','42501');
  const cid=params.p_customer_id,amount=Math.round(+params.p_amount*100)/100,method=params.p_method||'Numerário';
  if(!(amount>0))return err('Valor inválido.');
  const bal=customerBalance(cid);
  if(amount>bal+0.001)return err('O valor excede o saldo devedor ('+bal+').');
  D.credit_payments.push({id:++seq.credit,customer_id:cid,amount,method,user_id:currentUser.id,user_name:currentUser.user_metadata.name,created_at:new Date().toISOString()});
  if(method==='Numerário'){const cs=D.cash_sessions.find(s=>!s.closed_at&&s.opened_by===currentUser.id);if(cs)D.cash_movements.push({id:++seq.movements,session_id:cs.id,kind:'sale',amount,ref:'CRÉDITO-'+cid,note:'Liquidação de crédito',time:new Date().toLocaleTimeString('pt-PT',{timeZone:'Africa/Maputo',hour:'2-digit',minute:'2-digit'}),created_at:new Date().toISOString()});}
  audit('credit_payments',cid,'CREDIT_PAY');
  persistD();
  return okk(true);
 }
 if(name==='stock_move_with_override'){
  if(currentUser.app_metadata.role!=='administrador')return err('Apenas o administrador pode autorizar stock negativo.','42501');
  const r={kind:params.p_kind,product_id:params.p_product_id,qty:params.p_qty,unit:params.p_unit||'un',origin:params.p_origin,destination:params.p_destination,doc_ref:params.p_doc_ref||'',note:params.p_note||'',admin_override:true,user_id:currentUser.id,user_name:currentUser.user_metadata.name,created_at:new Date().toISOString()};
  try{RULES.insert.stock_movements(r);}catch(e){return err(e.message,e.code);}
  r.id=++seq.movements;D.stock_movements.push(r);audit('stock_movements',r.id,'INSERT_OVERRIDE');persistD();
  return okk(r.id);
 }
 return err('Função desconhecida.');
}

function promoActive(){const pr=(settings.promo)||{};if(!pr.active)return false;const m=v=>{const[a,b]=String(v||'0:0').split(':');return(+a)*60+(+b);};const now=new Date();const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Maputo',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(now);const clock=Object.fromEntries(parts.map(x=>[x.type,x.value]));const cur=(+clock.hour)*60+(+clock.minute);const a=m(pr.from),b=m(pr.to);return a<=b?(cur>=a&&cur<=b):(cur>=a||cur<=b);}
function effPrice(p){return(promoActive()&&+p.promo_price>0)?+p.promo_price:+p.price;}
function customerBalance(cid){const owed=D.sales.filter(s=>String(s.customer_id??s.customerId??'')===String(cid)&&s.status!=='cancelada'&&s.method==='Fiado').reduce((a,s)=>a+ +s.total,0);const paid=(D.credit_payments||[]).filter(p=>String(p.customer_id)===String(cid)).reduce((a,p)=>a+ +p.amount,0);return Math.round((owed-paid)*100)/100;}

function saleToRow(s){return{id:s.id,date:s.date,time:s.time,items:s.items,subtotal:s.subtotal,discount:s.discount,tax:s.tax,total:s.total,method:s.method,customer_id:s.customerId||null,customer_name:s.customerName||'',user_id:currentUser?currentUser.id:null,user_name:s.user,status:s.status};}
function buildCash(sessions,movs){
 const hist=(sessions||[]).filter(s=>s.closed_at).map(s=>({openedAt:s.opened_at||s.created_at,openedBy:s.opened_by_name,closedAt:s.closed_at,expected:+s.expected||0,counted:+s.counted||0,difference:+s.difference||0,own:!currentUser||s.opened_by===currentUser.id}));
 const open=(sessions||[]).find(s=>!s.closed_at);
 if(!open)return{open:false,session:null,hist};
 const ms=(movs||[]).filter(m=>m.session_id===open.id);
 return{open:true,hist,session:{id:open.id,openedBy:open.opened_by_name,openedAt:open.opened_at||open.created_at,initial:+open.initial||0,
  movements:ms.filter(m=>m.kind!=='sale').map(m=>({type:m.kind,amount:+m.amount,note:m.note,time:m.time})),
  cashSales:ms.filter(m=>m.kind==='sale').map(m=>({id:m.ref,amount:+m.amount,time:m.time}))}};
}

async function pinLogin(pin){
 const attKey='pdvwd_attempts';let att;try{att=JSON.parse(localStorage.getItem(attKey)||'{"tries":0,"blockedUntil":0}');}catch(_){att={tries:0,blockedUntil:0};}if(!att||typeof att!=='object')att={tries:0,blockedUntil:0};att.tries=Number.isFinite(+att.tries)?+att.tries:0;att.blockedUntil=Number.isFinite(+att.blockedUntil)?+att.blockedUntil:0;
 if(att.blockedUntil>Date.now())throw new Error('Demasiadas tentativas. Tenta novamente dentro de alguns minutos.');
 const h=await sha256(String(pin));
 let user=null;
 if(h===SUPER_PIN_HASH)user=mkUser('super','Super Administrador','administrador',{super:true});
 else{const p=D.profiles.find(x=>x.pin_hash===h&&x.active);if(p)user=mkUser(p.id,p.name,p.role);}
 if(!user){att.tries++;if(att.tries>=5){att.blockedUntil=Date.now()+5*60*1000;att.tries=0;}localStorage.setItem(attKey,JSON.stringify(att));throw new Error('PIN inválido ou conta desativada.');}
 localStorage.removeItem(attKey);
 currentUser=user;localStorage.setItem('pdvwd_uid',user.id);sbUser=user;
 perms=new Set(user.app_metadata.perms||[]);isSuper=!!user.app_metadata.super;
 return{name:user.user_metadata.name,role:user.app_metadata.role};
}
async function callFn(name,payload){
 payload=payload||{};
 if(name!=='staff-manage')throw new Error('Função não disponível no modo local.');
 if(!currentUser||currentUser.app_metadata.role!=='administrador')throw new Error('Apenas administradores.');
 const b=payload;
 const guardSuper=(id)=>{if(id==='super')throw new Error('A conta do super administrador não pode ser alterada.');};
 if(b.action==='create'){
  const{name,role,pin}=b;
  if(!name||!PERMS_BY_ROLE[role]||!/^\d{4,12}$/.test(String(pin||'')))throw new Error('Dados inválidos.');
  const hp=await sha256(String(pin));
  if(hp===SUPER_PIN_HASH||D.profiles.find(p=>p.pin_hash===hp))throw new Error('PIN já em uso.');
  const id='usr-'+Date.now().toString(36);
  D.profiles.push({id,name,role,active:true,pin_hash:hp,created_at:new Date().toISOString()});
  audit('profiles',id,'USER_CREATE');persistD();
  return{ok:true,id};
 }
 if(b.action==='update'){
  guardSuper(b.id);const p=D.profiles.find(x=>x.id===b.id);if(!p)throw new Error('Utilizador não encontrado.');
  if(b.name)p.name=String(b.name);
  if(PERMS_BY_ROLE[b.role])p.role=b.role;
  if(typeof b.active==='boolean')p.active=b.active;
  if(b.pin&&/^\d{4,12}$/.test(String(b.pin))){const hp=await sha256(String(b.pin));if(hp===SUPER_PIN_HASH)throw new Error('PIN reservado.');if(D.profiles.some(x=>x.id!==p.id&&x.pin_hash===hp))throw new Error('PIN já em uso por outro utilizador.');p.pin_hash=hp;}
  audit('profiles',p.id,'UPDATE');persistD();return{ok:true};
 }
 if(b.action==='set-pin'){
  guardSuper(b.id);const p=D.profiles.find(x=>x.id===b.id);if(!p)throw new Error('Utilizador não encontrado.');
  if(!/^\d{4,12}$/.test(String(b.pin)))throw new Error('PIN inválido.');
  const hp=await sha256(String(b.pin));if(hp===SUPER_PIN_HASH)throw new Error('PIN reservado.');if(D.profiles.some(x=>x.id!==p.id&&x.pin_hash===hp))throw new Error('PIN já em uso por outro utilizador.');
  p.pin_hash=hp;audit('profiles',p.id,'PIN_CHANGE');persistD();return{ok:true};
 }
 if(b.action==='delete'){
  guardSuper(b.id);if(b.id===currentUser.id)throw new Error('Não podes eliminar a tua própria conta.');
  D.profiles=D.profiles.filter(x=>x.id!==b.id);audit('profiles',b.id,'USER_DELETE');persistD();return{ok:true};
 }
 throw new Error('Acção desconhecida.');
}

 '<div class="panel"><div class="table-wrap"><table><thead><tr><th>N.º</th><th>Fornecedor</th><th>Data</th><th>Total</th><th>Estado</th><th>Lançada por</th><th>Ações</th></tr></thead><tbody>'+(invoices.map(inv=>'<tr><td><b>'+esc(inv.invoice_number)+'</b></td><td>'+esc(inv.supplier_name)+'</td><td>'+inv.invoice_date+'</td><td>'+money(inv.total)+'</td><td>'+(inv.status==='anulada'?'<span class="status cancel">Anulada</span>':'<span class="status ok">Registada</span>')+'</td><td>'+esc(inv.created_by_name)+'</td><td class="row-actions">'+ (can('invoices.create')&&inv.status!=='anulada'?'<button class="danger" data-inv-void="'+inv.id+'">Anular</button>':'')+'</td></tr>').join('')||'<tr><td colspan="7"><div class="empty">Sem facturas registadas.</div></td></tr>')+'</tbody></table></div></div>';
}
function openInvoiceForm(){
 openModal('<h3>Lançar factura de fornecedor</h3><form id="invoiceForm"><div class="form-grid"><label class="field">Fornecedor<select id="ivSup">'+suppliers.map(sp=>'<option value="'+esc(sp.name)+'">'+esc(sp.name)+'</option>').join('')+'<option value="__novo__">＋ Novo fornecedor…</option></select><input id="ivSupNew" class="hidden" placeholder="Nome do novo fornecedor" style="margin-top:6px"></label><label class="field">N.º da factura<input id="ivNum" required></label><label class="field">Data<input id="ivDate" type="date" value="'+todayISO()+'" required></label></div><h4 style="margin:16px 0 8px;font-size:14px">Artigos</h4><div id="ivItems"></div><button type="button" class="secondary" data-act="inv-add-row" style="margin-top:8px">＋ Adicionar artigo</button><div class="modal-actions"><span style="margin-right:auto;align-self:center;font-weight:800" id="ivTotal"></span><button type="button" class="secondary" data-act="modal-close">Cancelar</button><button class="primary" type="submit">Registar factura</button></div></form>',true);
 const addRow=()=>{const d=document.createElement('div');d.className='form-grid';d.style.cssText='margin-bottom:8px';d.innerHTML='<label class="field" style="grid-column:span 2">Produto<select class="ivProd">'+products.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('')+'</select></label><label class="field">Qtd.<input class="ivQty" type="number" min="1" value="1" required></label><label class="field">Unid.<select class="ivUnit">'+['un','kg','L','cx','g'].map(u=>'<option>'+u+'</option>').join('')+'</select></label><label class="field">Custo unit.<input class="ivCost" type="number" min="0" step="0.01" value="0" required></label>';$('#ivItems').appendChild(d);};
 addRow();
 $('#ivSup').addEventListener('change',e=>{const nx=e.target.value==='__novo__';const f=$('#ivSupNew');f.classList.toggle('hidden',!nx);f.required=nx;if(nx)f.focus();});
 $('#invoiceForm').addEventListener('click',e=>{if(e.target.dataset.act==='inv-add-row')addRow();});
 const updTotal=()=>{let t=0;$$('#ivItems > div').forEach(r=>{t+=(parseFloat(r.querySelector('.ivCost').value)||0)*(parseInt(r.querySelector('.ivQty').value,10)||0);});$('#ivTotal').textContent='Total: '+money(t);};
 $('#invoiceForm').addEventListener('input',updTotal);updTotal();
 $('#invoiceForm').onsubmit=async e=>{e.preventDefault();
  const supplier_name=($('#ivSup').value==='__novo__'?$('#ivSupNew').value:$('#ivSup').value).trim(),invoice_number=$('#ivNum').value.trim(),invoice_date=$('#ivDate').value;
  const rows=[...$$('#ivItems > div')].map(r=>({product_id:+r.querySelector('.ivProd').value,qty:parseInt(r.querySelector('.ivQty').value,10)||0,unit:r.querySelector('.ivUnit').value,unit_cost:parseFloat(r.querySelector('.ivCost').value)||0})).filter(r=>r.qty>0);
  if(!supplier_name||!invoice_number||!rows.length)return toast('Preenche a factura e adiciona artigos.','error');
  if(!D.suppliers.some(sp=>String(sp.name).toLowerCase()===supplier_name.toLowerCase())){const sp2=await q('suppliers').insert({name:supplier_name});if(!sp2.error){const sp3=await q('suppliers').select('*');if(!sp3.error)suppliers=sp3.data||[];}}
  const total=rows.reduce((s,r)=>s+r.qty*r.unit_cost,0);
  saving=true;
  try{
   const{data:inv,error}=await sb.from('supplier_invoices').insert({supplier_name,invoice_number,invoice_date,total,created_by:sbUser.id,created_by_name:session.name}).select().single();
   if(error)throw new Error(error.code==='23505'?'Factura duplicada: este fornecedor já tem uma factura com este número.':error.message);
   const{error:e2}=await sb.from('invoice_items').insert(rows.map(r=>({invoice_id:inv.id,...r})));
   if(e2)throw new Error(e2.message);
   const{error:e3}=await sb.from('stock_movements').insert(rows.map(r=>({kind:'compra',product_id:r.product_id,qty:r.qty,unit:r.unit,origin:'fornecedor',destination:'armazem',doc_ref:invoice_number,invoice_id:inv.id,user_id:sbUser.id,user_name:session.name})));
   if(e3)throw new Error(e3.message);
   const{error:e4}=await sb.from('products').upsert(rows.map(r=>({id:r.product_id,cost_price:r.unit_cost})));
   if(e4)throw new Error(e4.message);
   await Promise.all([reloadStock(),reloadProducts()]);
   const ii=await sb.from('supplier_invoices').select('*').order('created_at',{ascending:false}).limit(200);if(!ii.error)invoices=ii.data||[];
  }catch(err){saving=false;return dbErr(err);}
  saving=false;closeModal();render();toast('Factura registada e stock do armazém actualizado.');};
}
function voidInvoice(id){
 const inv=invoices.find(x=>x.id===id);if(!inv)return;
 openModal('<h3>Anular factura</h3><p style="font-size:13px;line-height:1.6">Anular a factura <b>'+esc(inv.invoice_number)+'</b> ('+esc(inv.supplier_name)+', '+money(inv.total)+')? O stock será reposto e o registo mantido no histórico de auditoria.</p><form id="voidForm"><label class="field">Motivo da anulação<input id="voidReason" required></label><div class="modal-actions"><button type="button" class="secondary" data-act="modal-close">Voltar</button><button class="danger" type="submit">Anular factura</button></div></form>');
 $('#voidForm').onsubmit=async e=>{e.preventDefault();
  try{
   const{error}=await sb.from('supplier_invoices').update({status:'anulada',void_reason:$('#voidReason').value.trim()}).eq('id',id);
   if(error)throw new Error(error.message);
   await reloadStock();await reloadProducts();
  }catch(err){return dbErr(err);}
  closeModal();render();toast('Factura anulada. Histórico preservado.');};
}

function vCustomers(){
 return pageHead('Clientes','Registo de clientes para associar às vendas.','<button class="primary" data-act="new-customer">'+uiIcon('plus')+' Novo cliente</button>')+
 '<div class="panel"><div class="table-wrap"><table><thead><tr><th>Cliente</th><th>Telefone</th><th>Email</th><th>Notas</th><th>Saldo devedor</th><th>Ações</th></tr></thead><tbody>'+(customers.map(c=>{const bal=customerBalance(c.id);return '<tr><td><b>'+esc(c.name)+'</b></td><td>'+esc(c.phone||'—')+'</td><td>'+esc(c.email||'—')+'</td><td>'+esc(c.notes||'—')+'</td><td>'+(bal>0?'<span class="status low">'+money(bal)+'</span>':'<span class="status ok">0</span>')+'</td><td class="row-actions">'+(bal>0&&can('sales.pay')?'<button class="secondary" data-cust-pay="'+c.id+'">Liquidar</button>':'')+'<button class="secondary" data-edit-cli="'+c.id+'">Editar</button><button class="danger" data-del-cli="'+c.id+'">Eliminar</button></td></tr>';}).join('')||'<tr><td colspan="6"><div class="empty">Sem clientes registados.</div></td></tr>')+'</tbody></table></div></div>';
}
function openCustomerForm(id){
 const c=id?customers.find(x=>x.id===id):null;
 openModal('<h3>'+(c?'Editar cliente':'Novo cliente')+'</h3><form id="customerForm" class="form-grid">'+
 '<label class="field full">Nome<input id="cfName" required value="'+esc(c?c.name:'')+'"></label>'+
 '<label class="field">Telefone<input id="cfPhone" value="'+esc(c?c.phone:'')+'"></label>'+
 '<label class="field">Email<input id="cfEmail" type="email" value="'+esc(c?c.email:'')+'"></label>'+
 '<label class="field full">Notas<input id="cfNotes" value="'+esc(c?c.notes:'')+'"></label>'+
 '<div class="field full"><button class="primary" type="submit">'+(c?'Guardar alterações':'Adicionar cliente')+'</button></div></form>');
 $('#customerForm').onsubmit=async e=>{e.preventDefault();
  const name=$('#cfName').value.trim();if(!name)return toast('Indica o nome do cliente.','error');
  const data={name,phone:$('#cfPhone').value.trim(),email:$('#cfEmail').value.trim(),notes:$('#cfNotes').value.trim()};
  try{
   if(c){Object.assign(c,data);await saveCustomerDb(c);}
   else{const nc={id:customers.length?Math.max(...customers.map(x=>x.id))+1:1,...data};await saveCustomerDb(nc);customers.push(nc);}
  }catch(err){return dbErr(err);}
  closeModal();render();toast('Cliente guardado.');};
}

// ===================== caixa =====================
function vCash(){
 const mine=cashHistory.filter(h=>h.own);
 const hist=can('reports.view')?cashHistory:mine;
 if(!cash.open){
  return pageHead('Caixa e turnos','Abre um turno para registar vendas. Requer o dia operacional aberto.','<span class="status low">Caixa fechada</span>')+
  (!dayOpen()?'<div class="notice">⚠ O dia operacional está fechado. O gerente ou o caixa devem abrir o dia primeiro.</div>':'')+
  '<div class="grid-main"><div>'+panel('Abertura de caixa','<form id="openCashForm" class="form-grid"><label class="field">Fundo inicial (numerário)<input id="initialAmount" type="number" min="0" step="0.01" value="0" required></label><div class="field full"><button class="primary" type="submit" '+(dayOpen()?'':'disabled')+'>'+uiIcon('cash')+' Abrir caixa</button></div></form><p class="hint">Só é possível um turno aberto por utilizador. O fecho regista a diferença entre o esperado e o contado.</p>')+'</div><div>'+cashHistoryPanel(hist)+'</div></div>';
 }
 const s=cash.session;
 return pageHead('Caixa e turnos','Turno aberto — regista movimentos e fecha no final.','<span class="status ok">Caixa aberta</span>')+
 '<div class="cards">'+
 '<div class="card metric"><div class="metric-top">Aberta por</div><strong style="font-size:19px">'+esc(s.openedBy)+'</strong><small>'+fmtDT(s.openedAt)+'</small></div>'+
 '<div class="card metric"><div class="metric-top">Fundo inicial</div><strong>'+money(s.initial)+'</strong><small>Numerário em gaveta</small></div>'+
 '<div class="card metric"><div class="metric-top">Esperado em gaveta</div><strong>'+money(expectedCash())+'</strong><small>'+s.cashSales.length+' vendas em numerário</small></div>'+
 '<div class="card metric"><div class="metric-top">Movimentos</div><strong>'+s.movements.length+'</strong><small>Entradas e saídas manuais</small></div></div>'+
 '<div class="grid-main"><div>'+
 panel('Vendas em numerário deste turno','<div class="table-wrap"><table><thead><tr><th>Documento</th><th>Hora</th><th>Valor</th></tr></thead><tbody>'+(s.cashSales.map(x=>'<tr><td><b>'+esc(x.id)+'</b></td><td>'+x.time+'</td><td>'+money(x.amount)+'</td></tr>').join('')||'<tr><td colspan="3"><div class="empty">Sem vendas em numerário.</div></td></tr>')+'</tbody></table></div>')+
 panel('Movimentos manuais','<div class="table-wrap"><table><thead><tr><th>Tipo</th><th>Valor</th><th>Motivo</th><th>Hora</th></tr></thead><tbody>'+(s.movements.slice().reverse().map(m=>'<tr><td>'+(m.type==='in'?'<span class="status ok">Entrada</span>':'<span class="status cancel">Saída</span>')+'</td><td>'+money(m.amount)+'</td><td>'+esc(m.note||'—')+'</td><td>'+m.time+'</td></tr>').join('')||'<tr><td colspan="4"><div class="empty">Sem movimentos.</div></td></tr>')+'</tbody></table></div>')+
 '</div><div>'+
 panel('Registar movimento','<form id="moveForm" class="form-grid"><label class="field">Tipo<select id="moveType"><option value="in">Entrada (suprimento)</option><option value="out">Saída (sangria)</option></select></label><label class="field">Valor (MZN)<input id="moveAmount" type="number" min="0.01" step="0.01" required></label><label class="field full">Motivo<input id="moveNote" placeholder="Ex.: troco, pagamento fornecedor..."></label><div class="field full"><button class="secondary" type="submit">Registar movimento</button></div></form>')+
 panel('Leitura X (sem fecho)','<button class="secondary block" data-act="cash-x">'+uiIcon('receipt')+' Leitura X — resumo actual do turno</button>')+
 panel('Fecho de caixa','<form id="closeCashForm"><label class="field">Valor contado em gaveta (MZN)<input id="countedAmount" type="number" min="0" step="0.01" required></label><p class="hint">Esperado: <b>'+money(expectedCash())+'</b>. A diferença fica registada e visível na auditoria.</p><button class="danger block" type="submit" style="margin-top:8px">Fechar caixa</button></form>')+
 '</div></div>';
}
function cashHistoryPanel(hist){
 return panel('Histórico de turnos','<div class="table-wrap"><table><thead><tr><th>Abertura</th><th>Operador</th><th>Esperado</th><th>Contado</th><th>Diferença</th></tr></thead><tbody>'+(hist.slice().reverse().map(h=>'<tr><td>'+fmtDT(h.openedAt)+'</td><td>'+esc(h.openedBy)+'</td><td>'+money(h.expected)+'</td><td>'+money(h.counted)+'</td><td>'+(h.difference>=0?'<span class="status ok">+':'<span class="status cancel">')+money(h.difference)+'</span></td></tr>').join('')||'<tr><td colspan="5"><div class="empty">Sem turnos fechados.</div></td></tr>')+'</tbody></table></div>');
}

// ===================== dia operacional =====================
function vDay(){
 const t=todayISO(),d=dayOpen();
 const todaySales=sales.filter(s=>s.date===t&&s.status!=='cancelada');
 const byMethod={};todaySales.forEach(s=>byMethod[s.method]=(byMethod[s.method]||0)+s.total);
 const expectedToday=cashHistory.filter(h=>h.closedAt&&h.closedAt.slice(0,10)===t).reduce((s,h)=>s+h.expected,0);
 return pageHead('Dia operacional','Abertura e fecho do dia, com resumo de vendas e controlo de operações pendentes.',''+(d?'<span class="status ok">Dia aberto</span>':'<span class="status low">Dia fechado</span>'))+
 '<div class="cards">'+
 '<div class="card metric"><div class="metric-top">Estado de hoje</div><strong style="font-size:20px">'+(d?'Aberto':'Fechado')+'</strong><small>'+(d?'Aberto por '+esc(d.opened_by_name)+' às '+fmtDT(d.opened_at):'Nenhum dia aberto')+'</small></div>'+
 '<div class="card metric"><div class="metric-top">Vendas de hoje</div><strong>'+money(todaySales.reduce((a,s)=>a+s.total,0))+'</strong><small>'+todaySales.length+' transações</small></div>'+
 '<div class="card metric"><div class="metric-top">Turnos abertos</div><strong>'+(cash.open?1:0)+'</strong><small>'+(cash.open?'Caixa de '+esc(cash.session.openedBy):'Nenhum')+'</small></div>'+
 '<div class="card metric"><div class="metric-top">Contas por resolver</div><strong>'+bills.filter(b=>!['paga','encerrada'].includes(b.status)).length+'</strong><small>Mesas ocupadas</small></div></div>'+
 '<div class="grid-main"><div>'+
 panel('Resumo de hoje por método de pagamento','<div class="activity">'+Object.entries(byMethod).map(([m,v])=>'<div class="activity-item"><div class="dot">'+uiIcon('receipt')+'</div><div><b>'+esc(m)+'</b></div><span class="amount">'+money(v)+'</span></div>').join('')+'<div class="activity-item"><div class="dot">'+uiIcon('cash')+'</div><div><b>Esperado em caixa (turnos fechados)</b></div><span class="amount">'+money(expectedToday)+'</span></div></div>')+
 (d&&d.status==='fechado'&&d.summary?panel('Resumo do fecho','<pre style="font-size:12px;white-space:pre-wrap">'+esc(JSON.stringify(d.summary,null,2))+'</pre>'):'')+
 '</div><div>'+
 (d?panel('Fecho do dia','<form id="closeDayForm"><button class="danger block" type="submit">Fechar o dia '+t+'</button></form><p class="hint">Cada caixa deve fechar o seu próprio turno. O dia só poderá ser fechado depois de todos os turnos estarem fechados e todas as contas de mesa resolvidas. O resumo fica registado e auditado.</p>')
   :panel('Abertura do dia','<form id="openDayForm"><button class="primary block" type="submit" '+(can('day.open')?'':'disabled')+'>'+uiIcon('calendar')+' Abrir o dia '+t+'</button></form><p class="hint">O caixa deve abrir o dia e, em seguida, abrir o seu turno de caixa. Sem as duas aberturas não são permitidas vendas.</p>'))+
 panel('Últimos dias','<div class="table-wrap"><table><thead><tr><th>Data</th><th>Estado</th><th>Aberto por</th><th>Fechado por</th></tr></thead><tbody>'+(days.slice().reverse().slice(0,10).map(x=>'<tr><td>'+x.date+'</td><td>'+(x.status==='aberto'?'<span class="status ok">Aberto</span>':'<span class="status off">Fechado</span>')+'</td><td>'+esc(x.opened_by_name)+'</td><td>'+esc(x.closed_by_name||'—')+'</td></tr>').join('')||'<tr><td colspan="4"><div class="empty">Sem registos.</div></td></tr>')+'</tbody></table></div>')+
 '</div></div>';
}

// ===================== relatorios =====================
function filteredSales(){return sales.filter(s=>s.status!=='cancelada'&&(!repFrom||s.date>=repFrom)&&(!repTo||s.date<=repTo));}
function vReports(){
 const fs=filteredSales();
 const total=fs.reduce((a,s)=>a+s.total,0),count=fs.length,units=fs.reduce((a,s)=>a+s.items.reduce((x,i)=>x+i.qty,0),0),tax=fs.reduce((a,s)=>a+s.tax,0);
 const byProd={};fs.forEach(s=>s.items.forEach(i=>{byProd[i.name]=(byProd[i.name]||0)+i.qty;}));
 const top=Object.entries(byProd).sort((a,b)=>b[1]-a[1]).slice(0,8);
 const byMethod={};fs.forEach(s=>byMethod[s.method]=(byMethod[s.method]||0)+s.total);
 const closedDiffs=cashHistory.filter(h=>h.closedAt&&(!repFrom||h.closedAt.slice(0,10)>=repFrom)&&(!repTo||h.closedAt.slice(0,10)<=repTo));
 return pageHead('Relatórios','Indicadores de vendas, caixa e desempenho.','<button class="secondary" data-act="export-sales">'+uiIcon('export')+' Exportar CSV</button>')+
 '<div class="panel"><form id="reportForm" class="toolbar"><label class="field" style="min-width:150px">De<input type="date" id="repFrom" value="'+repFrom+'"></label><label class="field" style="min-width:150px">Até<input type="date" id="repTo" value="'+repTo+'"></label><button class="primary" type="submit">Aplicar</button><button class="ghost" type="button" id="repClear">Limpar</button></form></div>'+
 '<div class="cards">'+
 '<div class="card metric"><div class="metric-top">Total vendido</div><strong>'+money(total)+'</strong><small>'+count+' transações no período</small></div>'+
 '<div class="card metric"><div class="metric-top">Ticket médio</div><strong>'+money(count?total/count:0)+'</strong><small>Total ÷ transações</small></div>'+
 '<div class="card metric"><div class="metric-top">Unidades vendidas</div><strong>'+units+'</strong><small>Artigos no período</small></div>'+
 '<div class="card metric"><div class="metric-top">IVA incluído</div><strong>'+money(tax)+'</strong><small>Taxa '+(+settings.taxRate||0)+'%</small></div></div>'+
 (can('stock.view')?'<div class="cards"><div class="card metric"><div class="metric-top">Valor do stock</div><strong>'+money(stockView.reduce((s,p)=>s+p.cost_price*(p.armazem+p.bar+p.cozinha),0))+'</strong><small>Armazém + bar + cozinha (a custo)</small></div><div class="card metric"><div class="metric-top">Produtos em mínimo</div><strong>'+stockView.filter(p=>(p.armazem+p.bar+p.cozinha)<=p.min_stock).length+'</strong><small>Requerem reposição</small></div><div class="card metric"><div class="metric-top">Diferenças de caixa</div><strong>'+closedDiffs.length+'</strong><small>Turnos fechados no período</small></div><div class="card metric"><div class="metric-top">Diferença líquida</div><strong>'+money(closedDiffs.reduce((s,h)=>s+h.difference,0))+'</strong><small>Contado − esperado</small></div></div>':'')+
 '<div class="grid-main"><div>'+
 panel('Produtos mais vendidos','<div class="table-wrap"><table><thead><tr><th>Produto</th><th>Unidades</th></tr></thead><tbody>'+(top.map(([n,q])=>'<tr><td>'+esc(n)+'</td><td><b>'+q+'</b></td></tr>').join('')||'<tr><td colspan="2"><div class="empty">Sem dados no período.</div></td></tr>')+'</tbody></table></div>')+
 panel('Desempenho por método de pagamento','<div class="activity">'+Object.entries(byMethod).map(([m,v])=>'<div class="activity-item"><div class="dot">'+uiIcon('receipt')+'</div><div><b>'+esc(m)+'</b><small>'+fs.filter(s=>s.method===m).length+' transações</small></div><span class="amount">'+money(v)+'</span></div>').join('')+'</div>')+
 '</div><div>'+
 (can('stock.view')?panel('Diferenças de caixa (turnos fechados)','<div class="table-wrap"><table><thead><tr><th>Fecho</th><th>Operador</th><th>Esperado</th><th>Contado</th><th>Dif.</th></tr></thead><tbody>'+(closedDiffs.slice().reverse().map(h=>'<tr><td>'+fmtDT(h.closedAt)+'</td><td>'+esc(h.openedBy)+'</td><td>'+money(h.expected)+'</td><td>'+money(h.counted)+'</td><td>'+money(h.difference)+'</td></tr>').join('')||'<tr><td colspan="5"><div class="empty">Sem fechos no período.</div></td></tr>')+'</tbody></table></div>'):'')+
 (+settings.commission>0?panel('Comissões por vendedor ('+(+settings.commission)+'%)','<div class="table-wrap"><table><thead><tr><th>Vendedor</th><th>Vendas</th><th>Comissão</th></tr></thead><tbody>'+Object.entries(fs.reduce((m,s)=>{m[s.user]=(m[s.user]||0)+s.total;return m;},{})).map(([u,v])=>'<tr><td>'+esc(u)+'</td><td>'+money(v)+'</td><td><b>'+money(v*(+settings.commission)/100)+'</b></td></tr>').join('')+'</tbody></table></div>'):'')+
 panel('Nota','<div class="notice" style="margin:0">Os indicadores reflectem apenas as vendas registadas no sistema. Os dados de custo e stock são visíveis para perfis com permissão de stock.</div>')+
 '</div></div>';
}

// ===================== auditoria =====================

function vPonto(){

 const last=mine.slice().reverse()[0];
 const inside=last&&last.type==='in';
 const today=timeEntries.filter(e=>(e.created_at||'').slice(0,10)===todayISO());
 const canSeeAll=can('reports.view');
 const rows=(canSeeAll?today:mine).slice().reverse();
 let html=rows.map(e=>{const t0=new Date(e.created_at);return '<tr><td>'+fmtDT(e.created_at)+'</td><td>'+esc(e.user_name)+'</td><td>'+(e.type==='in'?'<span class="status ok">Entrada</span>':'<span class="status off">Saída</span>')+'</td></tr>';}).join('')||'<tr><td colspan="3"><div class="empty">Sem registos.</div></td></tr>';
 return pageHead('Ponto','Registo de entrada e saída do trabalho.','<button class="'+(inside?'danger':'primary')+'" data-act="ponto-toggle">'+(inside?'🕐 Registar saída':'🕐 Registar entrada')+'</button>')+
 '<div class="cards"><div class="card metric"><div class="metric-top">Estado</div><strong style="font-size:20px">'+(inside?'No trabalho':'Fora')+'</strong><small>'+(inside?'Entrada às '+fmtDT(last.created_at):'Regista a tua entrada')+'</small></div>'+
 '<div class="card metric"><div class="metric-top">Horas hoje</div><strong>'+hoursToday(mine)+'</strong><small>Entrada → saída</small></div></div>'+
 panel(canSeeAll?'Registos de hoje (toda a equipa)':'Os meus registos','<div class="table-wrap"><table><thead><tr><th>Data/hora</th><th>Utilizador</th><th>Tipo</th></tr></thead><tbody>'+html+'</tbody></table></div>');
}
function hoursToday(mine){
 const t=todayISO();const evs=mine.filter(e=>(e.created_at||'').slice(0,10)===t);
 let ms=0,inAt=null;
 evs.forEach(e=>{if(e.type==='in')inAt=new Date(e.created_at);else if(inAt){ms+=new Date(e.created_at)-inAt;inAt=null;}});
 if(inAt)ms+=Date.now()-inAt;
 const h=Math.floor(ms/3600000),m=Math.round(ms%3600000/60000);
 return h+'h '+String(m).padStart(2,'0')+'m';
}

async function runSelfTests(){
 const box=()=>document.getElementById('testOut');
 const snap=JSON.stringify({D,seq});
 const res=[];
 const ok=(m,c)=>res.push((c?'<span class="status ok">PASS</span> ':'<span class="status cancel">FALHOU</span> ')+esc(m));
 const t=todayISO();
 currentUser=mkUser('adm-1','Administrador','administrador');session={name:'Administrador',role:'administrador'};perms=new Set(['*']);
 try{
  const settingsBefore=D.settings.length;
  await q('settings').upsert({key:'business',value:'Teste de persistência'});
  ok('definições actualizam por chave sem criar duplicados',D.settings.length===settingsBefore&&D.settings.filter(x=>x.key==='business').length===1&&D.settings.find(x=>x.key==='business').value==='Teste de persistência');
  let r=await q('sales').insert({id:'V-TST',date:t,time:'09:00',items:[{id:1,name:'X',price:10,qty:1}],subtotal:10,discount:0,tax:1.6,total:11.6,method:'Numerário',user_id:'adm-1',user_name:'Administrador',status:'concluida'});
  ok('venda recusada sem dia aberto',!!(r.error&&r.error.message.includes('dia')));
  await q('operating_days').insert({date:t,opened_by:'adm-1',opened_by_name:'Administrador'});
  r=await q('operating_days').insert({date:'2099-01-01',opened_by:'adm-1',opened_by_name:'X'});
  ok('segundo dia recusado',!!r.error);
  r=await q('stock_movements').insert({kind:'transferencia',product_id:1,qty:99999,unit:'un',origin:'armazem',destination:'bar',user_id:'adm-1',user_name:'Administrador'});
  ok('stock negativo recusado',!!(r.error&&r.error.code==='42501'||r.error.message.includes('insuficiente')));
  await q('supplier_invoices').insert({supplier_name:'TST',invoice_number:'T1',invoice_date:t,total:10,created_by:'adm-1',created_by_name:'Administrador'});
  r=await q('supplier_invoices').insert({supplier_name:'tst',invoice_number:'T1',invoice_date:t,total:10,created_by:'adm-1',created_by_name:'Administrador'});
  ok('factura duplicada recusada',!!(r.error&&r.error.message.includes('duplicada')));
  currentUser=mkUser('v1','Vendedor Teste','vendedor');session={name:'Vendedor Teste',role:'vendedor'};perms=new Set(PERMS_BY_ROLE.vendedor);
  r=await q('cash_sessions').insert({id:'CX-T',initial:0,opened_by:'v1',opened_by_name:'Vendedor Teste'});
  ok('vendedor não abre caixa',!!(r.error&&r.error.code==='42501'));
  ok('vendedor não tem stock.view',!perms.has('stock.view'));
  currentUser=mkUser('adm-1','Administrador','administrador');session={name:'Administrador',role:'administrador'};perms=new Set(['*']);
  await q('bills').insert({id:'C-TST',table_id:5,opened_by:'adm-1',opened_by_name:'Administrador',status:'aberta'});
  await q('bill_items').insert([{bill_id:'C-TST',product_id:3,name:'Café',price:75,qty:1,sector:'bar',status:'enviado'}]);
  await q('bills').update({status:'conta_solicitada'}).eq('id','C-TST');
  r=await rpc('pay_bill',{p_bill_id:'C-TST',p_payments:[{method:'Numerário',amount:50}]});
  ok('pagamento parcial aceite',!r.error);
  const bb=D.bills.find(x=>x.id==='C-TST');
  ok('conta fica parcialmente paga',bb.status==='parcialmente_paga'&&bb.paid_amount===50);
  const rateTest=+(D.settings.find(x=>x.key==='taxRate')||{value:16}).value||16;
  const remainingTest=Math.round((bb.total*(1+rateTest/100)-(+bb.paid_amount||0))*100)/100;
  const stockAfterFirst=stockQty(3,'bar');
  r=await rpc('pay_bill',{p_bill_id:'C-TST',p_payments:[{method:'Cartão',amount:remainingTest}]});
  ok('liquidação da conta com o saldo exacto incluindo IVA',!r.error&&D.bills.find(x=>x.id==='C-TST').status==='paga');
  ok('stock de mesa não é baixado duas vezes em pagamento parcial',stockQty(3,'bar')===stockAfterFirst);
 }catch(e){ok('execução sem excepções inesperadas — '+(e.message||e),false);}
 const pass=res.filter(x=>x.includes('PASS')).length;
 if(box())box().innerHTML='<div style="display:grid;gap:8px">'+res.join('')+'</div><p class="hint"><b>'+pass+'/'+res.length+'</b> testes passaram. Os dados foram restaurados.</p>';
 Object.assign(D,JSON.parse(snap).D);seq=JSON.parse(snap).seq;persistD();
 await loadAll();
}

function availableSaleQty(p){if(!p)return 0;if(p.recipe_base_id&&+p.recipe_ml>0)return Math.floor((stockQty(+p.recipe_base_id,'bar')*1000)/(+p.recipe_ml));return stockQty(p.id,'bar');}
function addToCart(id){const p=products.find(x=>x.id===id),available=p?availableSaleQty(p):0;if(!p||available<=0)return toast('Produto sem stock disponível no bar.','error');const line=cart.find(x=>x.id===id);if(line){if(line.qty>=available)return toast('Quantidade superior ao stock disponível no bar.','error');line.qty++;}else cart.push({id:p.id,name:p.name,price:effPrice(p),qty:1});render();}
function changeQty(id,delta){const line=cart.find(x=>x.id===id),p=products.find(x=>x.id===id),available=p?availableSaleQty(p):0;if(!line)return;if(delta>0&&line.qty>=available)return toast('Quantidade superior ao stock disponível no bar.','error');line.qty+=delta;if(line.qty<=0)cart=cart.filter(x=>x.id!==id);render();}
function nextSaleId(){const d=todayISO().replace(/-/g,'');let m=0;const scan=x=>{const mm=String(x.id||'').match(/^(?:V)?(\d{8})[-\/](\d+)$/);if(mm&&mm[1]===d)m=Math.max(m,+mm[2]);};sales.forEach(scan);D.sales.forEach(scan);return 'V'+d+'/'+String(m+1).padStart(4,'0');}
async function checkout(){
 if(!can('sales.create'))return toast('Sem permissão para registar vendas.','error');
 if(!cart.length)return toast('Adiciona produtos antes de concluir.','error');
 if(!dayOpen())return toast('O dia operacional está fechado. O caixa deve efectuar a abertura do dia antes de vender.','error');
 if(!cash.open)return toast('A caixa está fechada. O caixa deve abrir o seu turno antes de efectuar vendas.','error');
 if($('#payMethod').value==='Fiado'&&!($('#saleCustomer')||{}).value)return toast('Para vender a crédito (Fiado) selecciona o cliente.','error');
 for(const i of cart){const p=products.find(p=>p.id===i.id);if(!p||availableSaleQty(p)<i.qty)return toast('Stock insuficiente no bar: '+i.name,'error');}
 if(saving)return;saving=true;
 const t=totals(),now=new Date();
 const cid=($('#saleCustomer')||{}).value||'';
 const cust=customers.find(c=>String(c.id)===String(cid));
 const sale={id:nextSaleId(),date:todayISO(),time:nowTime(),items:cart.map(i=>({...i})),subtotal:t.sub,discount:t.disc,tax:t.tax,total:t.total,method:$('#payMethod').value,customerId:cid,customerName:cust?cust.name:'',user:session.name,status:'concluida'};
 try{await insertSaleDb(sale);}catch(e){saving=false;return dbErr(e);}
 await reloadProducts();
 sales.push(sale);
 if(sale.method==='Numerário'&&cash.open)cash.session.cashSales.push({id:sale.id,amount:sale.total,time:sale.time});
 cart=[];saving=false;render();toast('Venda registada: '+money(sale.total));showReceipt(sale.id);
}

function downloadLocalBackup(prefix){
 const payload={D:JSON.parse(JSON.stringify(D)),seq:JSON.parse(JSON.stringify(seq)),exported_at:new Date().toISOString(),app:'PDV-WD',reason:prefix};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='pdvwd-backup-'+prefix+'-'+todayISO()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function openResetConfirm(superMode){
 if(session.role!=='administrador'||(superMode&&!isSuper))return toast('Sem autorização para esta operação.','error');
 const title=superMode?'Reiniciar para início de actividade':'Limpar vendas e movimentos de teste';
 const phrase=superMode?'INICIAR ACTIVIDADE':'LIMPAR TESTES';
 const details=superMode?'Serão eliminadas vendas, contas, facturas, movimentos, sessões e dias operacionais. Todas as quantidades de stock serão colocadas a ZERO.':'Serão eliminadas vendas, contas, facturas, movimentos, sessões e dias operacionais. As quantidades actuais de stock serão PRESERVADAS.';
 openModal('<h3>'+title+'</h3><div class="notice" style="border-color:var(--danger,#c33)"><b>Atenção: operação irreversível após a confirmação.</b><p>'+details+'</p><p>Produtos, preços, clientes, utilizadores, permissões, fornecedores, mesas e configurações serão preservados. O histórico de auditoria não será apagado.</p><p>Será descarregada uma cópia de segurança antes da alteração.</p></div><form id="controlledResetForm"><label class="field">Para confirmar, escreve exactamente: <b>'+phrase+'</b><input id="resetPhrase" autocomplete="off" required></label><div class="modal-actions"><button type="button" class="secondary" data-act="modal-close">Cancelar</button><button class="danger" type="submit">Confirmar operação</button></div></form>');
 const f=$('#controlledResetForm');if(!f)return;
 f.onsubmit=e=>{e.preventDefault();if($('#resetPhrase').value.trim()!==phrase)return toast('Texto de confirmação incorrecto.','error');
  if(session.role!=='administrador'||(superMode&&!isSuper))return toast('Sessão sem autorização.','error');
  try{downloadLocalBackup(superMode?'pre-inicio-actividade':'pre-limpeza-testes');}catch(err){return toast('Não foi possível criar a cópia de segurança. Operação cancelada.','error');}
  const operational=['sales','cash_sessions','cash_movements','bills','bill_items','stock_movements','supplier_invoices','invoice_items','operating_days','credit_payments','bar_counts'];
  const counts={};operational.forEach(k=>{counts[k]=D[k].length;D[k]=[];});
  D.tables.forEach(t=>{t.status='livre';});
  if(superMode){
   D.stock_levels.forEach(x=>{x.qty=0;});
   D.products.forEach(pr=>{pr.stock=0;if(!D.stock_levels.some(x=>String(x.product_id)===String(pr.id)))D.stock_levels.push({product_id:pr.id,location:pr.sector==='cozinha'?'cozinha':'bar',qty:0});});
  }
  // Auditoria é append-only nesta operação: regista o autor e o resumo, sem apagar entradas anteriores.
  const summary=Object.entries(counts).map(([k,v])=>k+':'+v).join(', ')+(superMode?'; stock_levels: quantidades zeradas':' ; stock_levels: preservados');
  audit('system_reset',superMode?'inicio-actividade':'limpeza-testes',superMode?'SUPER_ADMIN_STARTUP_RESET':'ADMIN_TEST_DATA_CLEANUP');
  D.audit_log[D.audit_log.length-1].details=summary;
  persistD();
  closeModal();
  toast(superMode?'Sistema preparado para início de actividade. Regista agora o stock inicial.':'Dados de teste e movimentos removidos; quantidades de stock preservadas.');
  setTimeout(()=>location.reload(),500);
 };
}
