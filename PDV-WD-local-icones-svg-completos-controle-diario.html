document.addEventListener('click',e=>{
 const el=e.target.closest('[data-nav],[data-navgroup],[data-cat],[data-add],[data-qty],[data-act],[data-view-sale],[data-cancel-sale],[data-edit-prod],[data-del-prod],[data-edit-cli],[data-del-cli],[data-edit-user],[data-toggle-user],[data-del-user],[data-table],[data-bill-add],[data-billitem-del],[data-bill-send],[data-bill-request],[data-bill-print],[data-bill-pay],[data-bill-view],[data-inv-void],[data-kds-act],[data-bill-move],[data-cust-pay],[data-sup-del]');
 if(!el)return;
 if(el.dataset.navgroup!==undefined){navExpandedGroup=navExpandedGroup===el.dataset.navgroup?'':el.dataset.navgroup;buildNav();return;}
 if(el.dataset.nav!==undefined)return go(el.dataset.nav);
 if(el.dataset.cat){posCat=el.dataset.cat;return render();}
 if(el.dataset.add)return addToCart(+el.dataset.add);
 if(el.dataset.qty)return changeQty(+el.dataset.qty,+el.dataset.qtyDelta);
 if(el.dataset.act)return action(el.dataset.act,el);
 if(el.dataset.viewSale)return showReceipt(el.dataset.viewSale);
 if(el.dataset.cancelSale)return cancelSale(el.dataset.cancelSale);
 if(el.dataset.editProd)return openProductForm(+el.dataset.editProd);
 if(el.dataset.delProd){const p=products.find(x=>x.id===+el.dataset.delProd);if(p&&confirm('Eliminar o produto "'+p.name+'"?')){(async()=>{try{await deleteProductDb(p.id);products=products.filter(x=>x.id!==p.id);await reloadStock();render();toast('Produto eliminado.');}catch(e){dbErr(e);}})();}return;}
 if(el.dataset.editCli)return openCustomerForm(+el.dataset.editCli);
 if(el.dataset.delCli){const c=customers.find(x=>x.id===+el.dataset.delCli);if(c&&confirm('Eliminar o cliente "'+c.name+'"?')){(async()=>{try{await deleteCustomerDb(c.id);customers=customers.filter(x=>x.id!==c.id);render();toast('Cliente eliminado.');}catch(e){dbErr(e);}})();}return;}
 if(el.dataset.editUser)return openUserForm(el.dataset.editUser);
 if(el.dataset.toggleUser){const u=users.find(x=>x.id===el.dataset.toggleUser);if(u){(async()=>{try{await callFn('staff-manage',{action:'update',id:u.id,active:!u.active});u.active=!u.active;render();toast('Utilizador '+(u.active?'ativado':'desativado')+'.');}catch(e){dbErr(e);}})();}return;}
 if(el.dataset.delUser){const u=users.find(x=>x.id===el.dataset.delUser);if(u&&confirm('Eliminar a conta de "'+u.name+'"?')){(async()=>{try{await callFn('staff-manage',{action:'delete',id:u.id});users=users.filter(x=>x.id!==u.id);render();toast('Conta eliminada.');}catch(e){dbErr(e);}})();}return;}
 if(el.dataset.table)return openTable(+el.dataset.table);
 if(el.dataset.billAdd)return billAddItem(+el.dataset.billAdd);
 if(el.dataset.billitemDel)return billItemDelete(+el.dataset.billitemDel);
 if(el.dataset.billSend)return billSendOrder(el.dataset.billSend);
 if(el.dataset.billRequest)return billRequest(el.dataset.billRequest);
 if(el.dataset.billPrint)return billPrint(el.dataset.billPrint);
 if(el.dataset.billPay)return billPay(el.dataset.billPay);
 if(el.dataset.billReceipt)return showReceipt(el.dataset.billReceipt);
 if(el.dataset.invVoid)return voidInvoice(+el.dataset.invVoid);
 if(el.dataset.kdsAct)return kdsSet(+el.dataset.id,el.dataset.kdsAct);
 if(el.dataset.billMove)return moveBillModal(el.dataset.billMove);
 if(el.dataset.custPay)return payCreditModal(+el.dataset.custPay);
 if(el.dataset.supDel)return delSupplier(+el.dataset.supDel);
});

function bindPage(){
 const ps=$('#posSearch');if(ps){ps.value=posQuery;ps.addEventListener('input',()=>{posQuery=ps.value;render();const n=$('#posSearch');n.focus();n.setSelectionRange(n.value.length,n.value.length);});}
 const bs=$('#billSearch');if(bs)bs.addEventListener('input',()=>{const q=bs.value.toLowerCase();$$('#content .product-grid .product').forEach(b=>{b.style.display=(b.textContent.toLowerCase().includes(q)?'':'none');});});
 const disc=$('#discount');if(disc&&disc.type==='number'){disc.addEventListener('input',updateTotals);updateTotals();}
 const pay=$('#payMethod');if(pay)pay.addEventListener('change',updateTotals);
 const pr=$('#prodSearch');if(pr){pr.value=prodQuery;pr.addEventListener('input',()=>{prodQuery=pr.value;$('#prodRows').innerHTML=productRows();});}
 const ss=$('#salesSearch');if(ss){ss.value=salesQuery;ss.addEventListener('input',()=>{salesQuery=ss.value;$('#salesRows').innerHTML=salesRows();});}
 const ocf=$('#openCashForm');if(ocf)ocf.onsubmit=async e=>{e.preventDefault();const v=parseFloat($('#initialAmount').value);if(!isFinite(v)||v<0)return toast('Valor inicial inválido.','error');try{const id=await openCashDb(v);cash={open:true,session:{id,openedBy:session.name,openedAt:new Date().toISOString(),initial:v,movements:[],cashSales:[]}};render();toast('Caixa aberta. Bom turno!');}catch(err){dbErr(err);}};
 const mf=$('#moveForm');if(mf)mf.onsubmit=async e=>{e.preventDefault();const amount=parseFloat($('#moveAmount').value);if(!isFinite(amount)||amount<=0)return toast('Valor inválido.','error');try{await addMovementDb($('#moveType').value,amount,$('#moveNote').value.trim());cash.session.movements.push({type:$('#moveType').value,amount,note:$('#moveNote').value.trim(),time:nowTime()});render();toast('Movimento registado.');}catch(err){dbErr(err);}};
 const cf=$('#closeCashForm');if(cf)cf.onsubmit=async e=>{e.preventDefault();const counted=parseFloat($('#countedAmount').value);if(!isFinite(counted)||counted<0)return toast('Valor inválido.','error');try{const s=cash.session;const r=await closeCashDb(counted);cashHistory.push({openedAt:s.openedAt,openedBy:s.openedBy,closedAt:new Date().toISOString(),expected:r.expected,counted,difference:r.difference,own:true});cash={open:false,session:null};render();toast('Caixa fechada. Diferença: '+(r.difference>=0?'+':'')+money(r.difference)+'.');}catch(err){dbErr(err);}};
 const smf=$('#moveStockForm');if(smf)smf.onsubmit=async e=>{e.preventDefault();
  const kind=$('#smKind').value,product_id=+$('#smProd').value,qty=parseInt($('#smQty').value,10),unit=$('#smUnit').value.trim()||'un',origin=$('#smOrigin').value,destination=$('#smDest').value,doc_ref=$('#smRef').value.trim(),note=$('#smNote').value.trim();
  if(!Number.isInteger(qty)||qty<=0)return toast('Quantidade inválida.','error');
  if(kind==='transferencia'&&origin===destination)return toast('A origem e o destino têm de ser diferentes.','error');
  if(kind!=='transferencia'&&destination!=='exterior')return toast('Saídas e perdas devem ter destino "Exterior".','error');
  const override=$('#smOverride')&&$('#smOverride').checked;
  try{
   if(override){await sb.rpc('stock_move_with_override',{p_kind:kind,p_product_id:product_id,p_qty:qty,p_unit:unit,p_origin:origin,p_destination:destination,p_doc_ref:doc_ref,p_note:note});}
   else{const{error}=await sb.from('stock_movements').insert({kind,product_id,qty,unit,origin,destination,doc_ref,note,user_id:sbUser.id,user_name:session.name});if(error)throw new Error(error.message);}
   await reloadStock();render();toast('Movimento registado.');
  }catch(err){dbErr(err);}
 };
 const odf=$('#openDayForm');if(odf)odf.onsubmit=async e=>{e.preventDefault();try{const{error}=await sb.from('operating_days').insert({date:todayISO(),opened_by:sbUser.id,opened_by_name:session.name});if(error)throw new Error(error.message);const d=await sb.from('operating_days').select('*').order('date');if(!d.error)days=d.data||[];render();toast('Dia operacional aberto.');}catch(err){dbErr(err);}};
 const cdf=$('#closeDayForm');if(cdf)cdf.onsubmit=async e=>{e.preventDefault();
  const t=todayISO();const ts=sales.filter(s=>s.date===t&&s.status!=='cancelada');
  const byMethod={};ts.forEach(s=>byMethod[s.method]=(byMethod[s.method]||0)+s.total);
  const summary={vendas:ts.length,total:+ts.reduce((a,s)=>a+s.total,0).toFixed(2),por_metodo:byMethod,iva:+ts.reduce((a,s)=>a+s.tax,0).toFixed(2)};
  try{
   const{error}=await sb.from('operating_days').update({status:'fechado',closed_by:sbUser.id,closed_by_name:session.name,closed_at:new Date().toISOString(),summary}).eq('date',t);
   if(error)throw new Error(error.message);
   const d=await sb.from('operating_days').select('*').order('date');if(!d.error)days=d.data||[];
   render();toast('Dia fechado com sucesso.');
  }catch(err){dbErr(err);}
 };
 const rf=$('#reportForm');if(rf){rf.onsubmit=e=>{e.preventDefault();repFrom=$('#repFrom').value;repTo=$('#repTo').value;render();};const rc=$('#repClear');if(rc)rc.onclick=()=>{repFrom='';repTo='';render();};}
 const sf=$('#settingsForm');if(sf)sf.onsubmit=async e=>{e.preventDefault();settings.business=$('#setBusiness').value.trim()||settings.business;const tx=parseFloat($('#setTax').value);if(isFinite(tx)&&tx>=0&&tx<=100)settings.taxRate=tx;settings.allow_negative_stock=$('#setNeg').value==='true';settings.commission=parseFloat($('#setComm').value)||0;settings.promo={active:$('#setPromoOn').value==='true',from:$('#setPromoFrom').value,to:$('#setPromoTo').value};const dark=$('#setTheme').value==='dark';document.body.classList.toggle('dark',dark);DB.set('dark',dark);try{await saveSettingsDb();}catch(err){return dbErr(err);}render();toast('Configurações guardadas.');};
 const bcf=$('#barCountForm');if(bcf)bcf.onsubmit=e=>{e.preventDefault();if(!can('bar.reconcile'))return toast('Sem permissão para picagem do bar.','error');const note=$('#bcNote').value.trim();const rows=$$('.bc-physical').map(inp=>{const p=products.find(x=>String(x.id)===String(inp.dataset.product));const physical=Number(inp.value),theoretical=stockQty(p.id,'bar');return {product_id:p.id,product_name:p.name,unit:p.unit||'un',theoretical,physical,difference:physical-theoretical,note,user_id:currentUser.id,user_name:session.name,created_at:new Date().toISOString(),status:'pendente'};});if(rows.some(x=>!Number.isFinite(x.physical)||x.physical<0))return toast('Verifica as quantidades físicas.','error');D.bar_counts.push(...rows);audit('bar_counts','picagem-'+Date.now(),'COUNT_RECORDED');persistD();render();toast('Picagem guardada. O stock não foi alterado.');};
 const cf2=$('#countForm');if(cf2)cf2.onsubmit=async e=>{e.preventDefault();const counts={};$$('.cnt').forEach(i=>{counts[i.dataset.key]=i.value;});try{const{data,error}=await sb.rpc('apply_count',{p_counts:counts});if(error)throw new Error(error.message);await reloadStock();await reloadProducts();render();toast('Contagem aplicada: '+(data||0)+' ajuste(s).');}catch(err){dbErr(err);}};
 const rf2=$('#restoreFile');if(rf2)rf2.onchange=()=>{const f=rf2.files&&rf2.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d||!d.D||!Array.isArray(d.D.products)||!Array.isArray(d.D.sales)||!Array.isArray(d.D.profiles))throw new Error('ficheiro inválido ou incompleto');const requiredTables=Object.keys(D);for(const k of requiredTables){if(!Array.isArray(d.D[k]))d.D[k]=[];}if(!confirm('Restaurar substitui TODOS os dados actuais deste dispositivo. Continuar?'))return;const restored=JSON.parse(JSON.stringify(d.D));for(const k of Object.keys(D))D[k]=restored[k];seq=d.seq&&typeof d.seq==='object'?d.seq:{};persistD();location.reload();}catch(e){toast('Cópia inválida: '+e.message,'error');}};rd.readAsText(f);};
}

// ===================== funcoes novas (KDS, mesas, credito, fornecedores, X, export) =====================
function kdsSet(id,st){(async()=>{try{const{error}=await sb.from('bill_items').update({status:st}).eq('id',id);if(error)throw new Error(error.message);await reloadTables();render();toast(st==='pronto'?'Pedido pronto para entrega.':'Em preparo.');}catch(e){dbErr(e);}})();}
function moveBillModal(bid){const b=bills.find(x=>x.id===bid);if(!b)return;const others=tables.filter(t=>t.id!==b.table_id);openModal('<h3>Transferir / unir mesa</h3><p style="font-size:13px;line-height:1.6">Conta <b>'+esc(b.id)+'</b> da <b>'+esc((tables.find(t=>t.id===b.table_id)||{}).label||'?')+'</b>. Mesa livre = transfere a conta; mesa ocupada = une as contas numa só.</p><form id="moveForm" class="form-grid"><label class="field full">Mesa de destino<select id="mvTarget">'+others.map(t=>{const occ=bills.some(x=>x.table_id===t.id&&!['paga','encerrada'].includes(x.status));return '<option value="'+t.id+'">'+esc(t.label)+(occ?' (ocupada — une)':' (livre)')+'</option>';}).join('')+'</select></label><div class="field full"><button class="primary" type="submit">Confirmar</button></div></form>');
 $('#moveForm').onsubmit=async e=>{e.preventDefault();try{const{error}=await sb.rpc('move_bill',{p_bill_id:bid,p_target_table:+$('#mvTarget').value,p_source_table:b.table_id});if(error)throw new Error(error.message);await reloadTables();curBillTable=null;closeModal();render();toast('Conta movida.');}catch(e){dbErr(e);}};}
function payCreditModal(cid){const c=customers.find(x=>x.id===cid);if(!c)return;const bal=customerBalance(cid);openModal('<h3>Liquidar dívida — '+esc(c.name)+'</h3><p style="font-size:13px">Saldo devedor: <b>'+money(bal)+'</b></p><form id="creditForm" class="form-grid"><label class="field">Valor (MZN)<input id="crAmount" type="number" min="0.01" max="'+bal+'" step="0.01" value="'+bal+'" required></label><label class="field">Método<select id="crMethod"><option>Numerário</option><option>Cartão</option><option>Transferência</option><option>Outro</option></select></label><div class="field full"><button class="primary" type="submit">Registar pagamento</button></div></form>');
 $('#creditForm').onsubmit=async e=>{e.preventDefault();try{const{error}=await sb.rpc('pay_credit',{p_customer_id:cid,p_amount:parseFloat($('#crAmount').value),p_method:$('#crMethod').value});if(error)throw new Error(error.message);const cm=await sb.from('cash_movements').select('*');const cs=await sb.from('cash_sessions').select('*');if(!cm.error&&!cs.error){const cc=buildCash(cs.data,cm.data);cash={open:cc.open,session:cc.session};}closeModal();render();toast('Dívida liquidada.');}catch(e){dbErr(e);}};}
async function delSupplier(id){const sp=suppliers.find(x=>x.id===id);if(!sp)return;if(!confirm('Eliminar o fornecedor "'+sp.name+'"?'))return;try{const{error}=await sb.from('suppliers').delete().eq('id',id);if(error)throw new Error(error.message);suppliers=suppliers.filter(x=>x.id!==id);render();toast('Fornecedor eliminado.');}catch(e){dbErr(e);}}
function suppliersManage(){openModal('<h3>Fornecedores</h3><div>'+(suppliers.map(sp=>'<div class="cart-line"><div><b>'+esc(sp.name)+'</b><small>'+esc([sp.phone,sp.nuit].filter(Boolean).join(' · '))+'</small></div><button class="danger" data-sup-del="'+sp.id+'">✕</button></div>').join('')||'<div class="empty">Sem fornecedores.</div>')+'</div><form id="supForm" class="form-grid" style="margin-top:12px"><label class="field" style="grid-column:span 2">Nome<input id="spName" required></label><label class="field">Telefone<input id="spPhone"></label><label class="field">NUIT<input id="spNuit"></label><div class="field full"><button class="primary" type="submit">Adicionar fornecedor</button></div></form>');
 $('#supForm').onsubmit=async e=>{e.preventDefault();try{const{error}=await sb.from('suppliers').insert({name:$('#spName').value.trim(),phone:$('#spPhone').value.trim(),nuit:$('#spNuit').value.trim()});if(error)throw new Error(error.message);const sp=await sb.from('suppliers').select('*');if(!sp.error)suppliers=sp.data||[];closeModal();render();toast('Fornecedor adicionado.');}catch(e){dbErr(e);}};}
function cashXRead(){if(!cash.open)return toast('Sem turno aberto.','error');const s=cash.session;openModal('<h3>Leitura X</h3><div class="totals"><div class="total-row"><span>Operador</span><b>'+esc(s.openedBy)+'</b></div><div class="total-row"><span>Abertura</span><span>'+fmtDT(s.openedAt)+'</span></div><div class="total-row"><span>Fundo inicial</span><span>'+money(s.initial)+'</span></div><div class="total-row"><span>Vendas em numerário</span><span>'+money(s.cashSales.reduce((a,x)=>a+x.amount,0))+'</span></div><div class="total-row"><span>Esperado em gaveta</span><b>'+money(expectedCash())+'</b></div></div><div class="modal-actions"><button class="primary" data-act="modal-close">Fechar</button></div>');}
function exportFile(name,rows){const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Ficheiro exportado.');}

// ===================== login / sessao / arranque =====================
$('#loginForm').addEventListener('submit',async e=>{
 e.preventDefault();
 const pin=$('#loginCode').value.trim();
 try{
  const profile=await pinLogin(pin);
  session={name:profile.name,role:profile.role};
  $('#loginError').textContent='';$('#loginCode').value='';
  await loadAll();
  const rp=await sb.from('role_permissions').select('role,permission');
  window.__rolePerms={};(rp.data||[]).forEach(r=>{window.__rolePerms[r.role]=(window.__rolePerms[r.role]?window.__rolePerms[r.role]+',':'')+r.permission;});
  enterApp();toast('Bem-vindo, '+session.name+'!');
 }catch(err){const msg=err.message||'Não foi possível iniciar sessão.';$('#loginError').textContent=msg;$('#loginCode').select();}
});
$('#logoutBtn').addEventListener('click',async()=>{try{if(sb)await sb.auth.signOut();}catch(e){}sbUser=null;session=null;perms=new Set();isSuper=false;cart=[];curBillTable=null;document.body.classList.remove('authenticated');$('#loginCode').value='';});
$('#themeBtn').addEventListener('click',()=>{const d=document.body.classList.toggle('dark');DB.set('dark',d);});
const sidebarBackdrop=$('#sidebarBackdrop');
function setMobileMenu(open,returnFocus=false){
 const sidebar=$('#sidebar'),btn=$('#menuBtn');
 const mobile=window.matchMedia('(max-width: 720px)').matches;
 const visible=!!open&&mobile;
 sidebar.classList.toggle('open',visible);
 sidebarBackdrop.classList.toggle('visible',visible);
 sidebarBackdrop.setAttribute('aria-hidden',String(!visible));
 btn.setAttribute('aria-expanded',String(visible));
 btn.setAttribute('aria-label',visible?'Fechar menu':'Abrir menu');
 btn.title=visible?'Fechar menu':'Abrir menu';
 btn.querySelector('span').textContent=visible?'×':'☰';
 document.body.style.overflow=visible?'hidden':'';
 if(visible){setTimeout(()=>{const active=sidebar.querySelector('.nav button.active')||sidebar.querySelector('.nav-group-toggle[aria-expanded="true"]')||sidebar;active.focus({preventScroll:true});},60);}
 else if(returnFocus)btn.focus({preventScroll:true});
}
$('#menuBtn').addEventListener('click',()=>setMobileMenu(!$('#sidebar').classList.contains('open')));
sidebarBackdrop.addEventListener('click',()=>setMobileMenu(false,true));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sidebar').classList.contains('open'))setMobileMenu(false,true);});
window.addEventListener('resize',()=>{if(!window.matchMedia('(max-width: 720px)').matches)setMobileMenu(false);});
$('#globalSearch').addEventListener('input',e=>{prodQuery=e.target.value;const m=MODULES.find(x=>x.id==='products');if(!canPage(m))return;if(page!=='products')page='products';buildNav();render();});
if(DB.get('dark',false))document.body.classList.add('dark');
(async function init(){
 const boot=$('#bootStatus');if(boot)boot.textContent='A preparar o sistema…';
 try{
  await loadAll(); // semeia/carrega os dados antes de qualquer login
  const{data:{session:s}}=await sb.auth.getSession();
  if(s){
   const{data:prof}=await sb.from('profiles').select('*').eq('id',s.user.id).single();
   if(prof){
    sbUser=s.user;session={name:prof.name,role:prof.role};perms=new Set(s.user.app_metadata?.perms||[]);isSuper=!!s.user.app_metadata?.super;
    await loadAll();
    const rp=await sb.from('role_permissions').select('role,permission');
    window.__rolePerms={};(rp.data||[]).forEach(r=>{window.__rolePerms[r.role]=(window.__rolePerms[r.role]?window.__rolePerms[r.role]+',':'')+r.permission;});
    enterApp();
   }
   }
  if(boot)boot.textContent='✔ Pronto: '+products.length+' produtos, '+tables.length+' mesas. Entra com o teu PIN.';
 }catch(e){if(boot)boot.textContent='✖ Erro ao arrancar: '+(e.message||e);}
})();
</script>
